<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Bajas y Salidas - Inventario</title>
    
    <!-- Librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-secondary { background-color: #333; color: #fff; }
        .btn-secondary:hover { background-color: #444; }

        .btn-danger { background-color: #b71c1c; color: #fff; }
        .btn-danger:hover { background-color: #d32f2f; }

        .btn-excel { background-color: #1b5e20; color: #fff; }
        .btn-excel:hover { background-color: #2e7d32; }

        /* Banner de Subtotales */
        .subtotales-banner {
            display: flex;
            gap: 20px;
            background-color: #1e1e1e;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .subtotal-item {
            display: flex;
            flex-direction: column;
        }

        .subtotal-label {
            font-size: 12px;
            color: #a0a0a0;
        }

        .subtotal-value {
            font-size: 18px;
            font-weight: bold;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 15px;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
        }

        .table-container {
            overflow-x: auto;
            background-color: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #2a2a2a;
        }

        th {
            background-color: #252525;
            color: #ff9800;
            font-weight: 600;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        .badge-salida {
            background-color: #e65100;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .img-thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Encabezado Principal -->
    <div class="header-container">
        <a href="dashboard.html" class="btn btn-secondary">📁 Volver al Dashboard</a>
        <h2>📋 Consolidado de Bajas y Salidas</h2>
        <button class="btn btn-excel" onclick="exportarExcelSalidas()">📥 Exportar Excel</button>
    </div>

    <!-- Banner con Subtotales Dinámicos -->
    <div class="subtotales-banner">
        <div class="subtotal-item">
            <span class="subtotal-label">Items Visibles:</span>
            <span class="subtotal-value" id="subtotal-registros" style="color: #00d2ff;">0</span>
        </div>
        <div class="subtotal-item" style="border-left: 1px solid #444; padding-left: 20px;">
            <span class="subtotal-label">Total Unidades (Cant.):</span>
            <span class="subtotal-value" id="subtotal-unidades" style="color: #00ff88;">0 unds</span>
        </div>
    </div>

    <!-- Filtros y Acciones -->
    <div class="controls-row">
        <input type="text" id="input-busqueda" class="search-input" placeholder="Buscar baja por precinto, remisión, referencia..." onkeyup="filtrarTabla()">
        <button class="btn btn-danger" onclick="eliminarSeleccionadosSalidas()">⌛ Borrando Selección</button>
    </div>

    <!-- Tabla -->
    <div class="table-container">
        <table id="tabla-salidas">
            <thead>
                <tr>
                    <th><input type="checkbox" id="check-all" onclick="marcarTodos(this)"></th>
                    <th>Foto</th>
                    <th>Fecha Salida</th>
                    <th>Código Precinto</th>
                    <th>Descripción</th>
                    <th>Referencia</th>
                    <th>Línea</th>
                    <th>Cant.</th>
                    <th>Tipo de Salida</th>
                    <th>No. Remisión</th>
                    <th>Acción Correctiva</th>
                </tr>
            </thead>
            <tbody id="tbody-salidas">
                <!-- Carga dinámica -->
            </tbody>
        </table>
    </div>

    <script>
        // -------------------------------------------------------------
        // INICIALIZACIÓN DE SUPABASE
        // Detecta automáticamente las credenciales existentes de tu proyecto
        // -------------------------------------------------------------
        let client = null;

        function obtenerClienteSupabase() {
            if (window.supabaseClient) return window.supabaseClient;
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                // Reemplazar si tienes tus llaves en variables de entorno o archivo config
                const URL_PROYECTO = window.SUPABASE_URL || "https://tu-proyecto.supabase.co"; 
                const KEY_PROYECTO = window.SUPABASE_KEY || "tu-anon-key";
                return window.supabase.createClient(URL_PROYECTO, KEY_PROYECTO);
            }
            return null;
        }

        let datosGlobalesSalidas = [];

        // 1. CARGAR REGISTROS
        async function cargarTablaSalidas() {
            const tbody = document.getElementById("tbody-salidas");
            if (!tbody) return;

            tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;">Cargando registros...</td></tr>`;

            client = obtenerClienteSupabase();

            if (!client) {
                console.warn("Cliente Supabase no detectado directamente, intentando lectura fallback...");
            }

            try {
                // Intentamos consultar la tabla de bajas / salidas
                let res = await client.from('bajas').select('*');
                
                // Si la tabla se llama 'salidas' en tu Supabase en vez de 'bajas'
                if (res.error && res.error.code === '42P01') {
                    res = await client.from('salidas').select('*');
                }

                if (res.error) throw res.error;

                datosGlobalesSalidas = res.data || [];
                renderizarTabla(datosGlobalesSalidas);

            } catch (err) {
                console.error("Error al cargar salidas:", err);
                tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:#ff5252; font-weight:bold;">
                    Error al cargar datos (${err.message || 'Error de conexión'}). Revisa la consola (F12).
                </td></tr>`;
            }
        }

        // 2. RENDERIZAR TABLA EN HTML
        function renderizarTabla(lista) {
            const tbody = document.getElementById("tbody-salidas");
            tbody.innerHTML = "";

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;">No hay registros de salidas disponibles.</td></tr>`;
                actualizarSubtotales(0, 0);
                return;
            }

            lista.forEach(item => {
                const tr = document.createElement("tr");
                const precinto = item.codigo_precinto || item.precinto || item.id || "";

                tr.innerHTML = `
                    <td><input type="checkbox" class="checkbox-item" value="${precinto}"></td>
                    <td><img src="${item.foto_url || item.foto || 'https://via.placeholder.com/40'}" class="img-thumb" alt="foto"></td>
                    <td>${item.fecha_salida || item.fecha || item.created_at || '-'}</td>
                    <td><strong>${precinto}</strong></td>
                    <td>${item.descripcion || '-'}</td>
                    <td>${item.referencia || '-'}</td>
                    <td>${item.linea || '-'}</td>
                    <td class="col-cantidad">${item.cantidad || item.cant || 1}</td>
                    <td><span class="badge-salida">${item.tipo_salida || 'SALIDA DEL INVENTARIO'}</span></td>
                    <td>${item.no_remision || item.remision || '-'}</td>
                    <td>${item.accion_correctiva || '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            filtrarTabla();
        }

        // 3. FILTRO EN TIEMPO REAL Y SUBTOTALES
        function filtrarTabla() {
            const inputBusqueda = document.getElementById("input-busqueda");
            const filtro = inputBusqueda ? inputBusqueda.value.toLowerCase() : "";
            const filas = document.querySelectorAll("#tbody-salidas tr");
            
            let registrosVisibles = 0;
            let sumaUnidades = 0;

            filas.forEach(fila => {
                if (fila.cells.length > 2) { // Evita filas de mensajes de error o carga
                    const texto = fila.textContent.toLowerCase();
                    if (texto.includes(filtro)) {
                        fila.style.display = "";
                        registrosVisibles++;
                        
                        const celdaCant = fila.querySelector(".col-cantidad");
                        if (celdaCant) {
                            sumaUnidades += parseInt(celdaCant.textContent.trim()) || 0;
                        }
                    } else {
                        fila.style.display = "none";
                    }
                }
            });

            actualizarSubtotales(registrosVisibles, sumaUnidades);
        }

        function actualizarSubtotales(registros, unidades) {
            const elReg = document.getElementById("subtotal-registros");
            const elUnd = document.getElementById("subtotal-unidades");
            if (elReg) elReg.textContent = registros;
            if (elUnd) elUnd.textContent = unidades.toLocaleString() + " unds";
        }

        // 4. ELIMINAR REGISTROS (Resuelve "Bad Request")
        async function eliminarSeleccionadosSalidas() {
            const checkboxes = document.querySelectorAll('.checkbox-item:checked');
            const seleccionados = Array.from(checkboxes).map(cb => cb.value);

            if (seleccionados.length === 0) {
                alert("Por favor selecciona al menos un registro para eliminar.");
                return;
            }

            if (!confirm(`¿Estás seguro de que deseas eliminar permanentemente ${seleccionados.length} registro(s)?`)) {
                return;
            }

            try {
                // Probamos eliminar por codigo_precinto o id
                let { error } = await client
                    .from('bajas')
                    .delete()
                    .in('codigo_precinto', seleccionados);

                if (error) {
                    // Reintento alternativo si la columna clave primaria es 'id'
                    const reintento = await client
                        .from('bajas')
                        .delete()
                        .in('id', seleccionados);

                    if (reintento.error) throw reintento.error;
                }

                alert("Registros eliminados con éxito.");
                cargarTablaSalidas();

            } catch (err) {
                console.error("Error al borrar:", err);
                alert("Error al intentar eliminar los registros: " + (err.message || "Bad Request"));
            }
        }

        // 5. EXPORTAR A EXCEL UNIFICADO (Columnas estructuradas como el Dashboard)
        function exportarExcelSalidas() {
            if (datosGlobalesSalidas.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }

            const datosMapeados = datosGlobalesSalidas.map(item => ({
                "Fecha Salida": item.fecha_salida || item.fecha || item.created_at || "",
                "Código Precinto": item.codigo_precinto || item.precinto || item.id || "",
                "Descripción": item.descripcion || "",
                "Referencia": item.referencia || "",
                "Línea": item.linea || "",
                "Cant.": item.cantidad || item.cant || 1,
                "Costo": item.costo ? `${item.costo} ${item.moneda || 'USD'}` : "",
                "Tipo de Salida": item.tipo_salida || "SALIDA DEL INVENTARIO",
                "No. Remisión": item.no_remision || item.remision || "-",
                "Ubicación": item.ubicacion || "",
                "Estado": item.estado || "BAJA",
                "Acción Correctiva": item.accion_correctiva || ""
            }));

            const worksheet = XLSX.utils.json_to_sheet(datosMapeados);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Historial_Salidas");

            const fechaStr = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `Reporte_Salidas_Inventario_${fechaStr}.xlsx`);
        }

        function marcarTodos(source) {
            const checkboxes = document.querySelectorAll('.checkbox-item');
            checkboxes.forEach(cb => cb.checked = source.checked);
        }

        document.addEventListener("DOMContentLoaded", cargarTablaSalidas);
    </script>
</body>
</html>
