<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Bajas - Inventario</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { background-color: #1e1e1e; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .contenedor { background-color: #2d2d2d; max-width: 95%; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.5); }
        .barra-control { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #444; padding-bottom: 15px; }
        .buscador { padding: 10px; width: 350px; border-radius: 6px; border: 1px solid #555; background-color: #1a1a1a; color: white; }
        .btn-volver { background-color: #444; color: white; text-decoration: none; padding: 10px 15px; border-radius: 6px; margin-right: 15px; font-weight: bold; }
        .btn-retornar { background-color: #0078D4; color: white; padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .btn-retornar:hover { background-color: #005a9e; }
        .contenedor-tabla { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { color: #fd7e14; text-align: left; padding: 12px; border-bottom: 2px solid #555; white-space: nowrap; }
        td { padding: 12px; border-bottom: 1px solid #444; vertical-align: middle; }
        tr:hover { background-color: #3d3d3d; }
        .foto-miniatura { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; border: 1px solid #444; }
        .estado-salida { background-color: #fd7e14; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        #mensajeCarga { text-align: center; color: #aaa; padding: 20px; font-style: italic; }

        /* ESTILOS DEL MENÚ DESPLEGABLE "OPCIONES" */
        .dropdown { position: relative; display: inline-block; }
        .btn-opciones { background-color: #0078D4; color: white; border: none; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-opciones:hover { background-color: #005a9e; }
        .dropdown-contenido { display: none; position: absolute; right: 0; background-color: #222222; min-width: 250px; box-shadow: 0px 8px 24px rgba(0,0,0,0.7); border: 1px solid #444; border-radius: 8px; z-index: 100; margin-top: 6px; overflow: hidden; }
        
        .dropdown-item { color: #ffffff; padding: 12px 16px; text-decoration: none; display: block; text-align: left; background: none; border: none; width: 100%; font-family: inherit; font-size: 14px; cursor: pointer; box-sizing: border-box; transition: 0.2s; font-weight: 500; }
        .dropdown-item:hover { background-color: #333333; }
        
        .item-excel { border-left: 4px solid #28a745; }
        .item-importar { border-left: 4px solid #17a2b8; } 
        
        .show { display: block; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="barra-control">
            <div style="display: flex; align-items: center;">
                <a href="dashboard.html" class="btn-volver">📦 Volver al Dashboard</a>
                <h2 style="margin: 0; color: #fd7e14;">📋 Consolidado de Bajas y Salidas</h2>
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <input type="text" id="inputBuscador" class="buscador" placeholder="🔍 Buscar baja por precinto, remisión...">
                
                <!-- MENÚ DESPLEGABLE OPCIONES -->
                <div class="dropdown">
                    <button class="btn-opciones" onclick="toggleDropdown()">⚙️ Opciones ▼</button>
                    <div id="dropdownOpciones" class="dropdown-contenido">
                        <input type="file" id="inputImportarExcel" accept=".xlsx, .xls, .csv" style="display: none;">
                        <button class="dropdown-item item-importar" onclick="document.getElementById('inputImportarExcel').click()">⬆️ Importar desde Excel</button>
                        
                        <button class="dropdown-item item-excel" id="btnExportarExcel">📥 Exportar Excel</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="contenedor-tabla">
            <table>
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Fecha Salida</th>
                        <th>Código Precinto</th>
                        <th>Referencia</th>
                        <th>Línea</th>
                        <th>Cant.</th>
                        <th>Tipo de Salida / Destino</th>
                        <th>No. Remisión</th>
                        <th>Acción Correctiva</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaSalidas"></tbody>
            </table>
            <div id="mensajeCarga">Cargando el archivo de bajas desde Supabase... ⏳</div>
        </div>
    </div>

    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- SCRIPT TIPO MÓDULO PARA SUPABASE -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // CONFIGURA AQUÍ TUS CREDENCIALES DE SUPABASE
        const supabaseUrl = 'https://emljzsxypeqecevffmwr.supabase.co';
        const supabaseKey = 'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W';
        // Agregamos la seguridad de sesión
        const supabase = createClient(supabaseUrl, supabaseKey, {
            auth: { storage: window.sessionStorage }
        });

        const tabla = document.getElementById('cuerpoTablaSalidas');
        const mensajeCarga = document.getElementById('mensajeCarga');
        let datosParaExcel = []; // Arreglo para exportar

        // Lógica del menú desplegable
        window.toggleDropdown = function() {
            document.getElementById("dropdownOpciones").classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.btn-opciones')) {
                const dropdowns = document.getElementsByClassName("dropdown-contenido");
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) {
                        dropdowns[i].classList.remove('show');
                    }
                }
            }
        }

        // 1. FUNCIÓN PRINCIPAL PARA CARGAR DATOS
        async function fetchBajas() {
            try {
                const { data, error } = await supabase
                    .from('prendas')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;
                renderTable(data);
            } catch (error) {
                console.error("Error al cargar las bajas:", error);
                mensajeCarga.textContent = "Error conectando con la base de datos.";
            }
        }

        // 2. RENDERIZADO DE TABLA
        function renderTable(data) {
            tabla.innerHTML = ""; 
            mensajeCarga.style.display = "none";
            datosParaExcel = []; // Reiniciamos los datos de exportación
            let contadorBajas = 0;
            
            if(!data || data.length === 0) {
                tabla.innerHTML = "<tr><td colspan='9' style='text-align:center; padding: 20px; color:#aaa;'>No hay registros en el sistema.</td></tr>";
                return;
            }

            data.forEach((prenda) => {
                // CONDICIÓN: Solo muestra lo que NO está disponible (lo que se dio de baja)
                if (prenda.estado && prenda.estado !== "Disponible en inventario") {
                    contadorBajas++;
                    const urlFoto = prenda.fotoUrl || 'logo.png'; 
                    const fila = document.createElement('tr');
                    
                    fila.innerHTML = `
                        <td><img src="${urlFoto}" class="foto-miniatura"></td>
                        <td>${prenda.salidaFecha || 'N/A'}</td>
                        <td style="font-weight: bold; color: #fff;">${prenda.precinto}</td>
                        <td>${prenda.referencia || '-'}</td>
                        <td>${prenda.linea || '-'}</td>
                        <td style="font-weight: bold; color: #fd7e14;">${prenda.cantidad || '1'}</td>
                        <td><span class="estado-salida">${prenda.estado}</span></td>
                        <td style="color: #ffc107; font-weight: 500;">${prenda.salidaRemision || '-'}</td>
                        <td>
                            <button class="btn-retornar" onclick="retornarAInventario('${prenda.id}')">↩️ Retornar a Bodega</button>
                        </td>
                    `;
                    tabla.appendChild(fila);

                    // Preparamos los datos para Excel
                    const partesDesc = [prenda.referencia, prenda.linea, prenda.color, prenda.talla, prenda.clasificacion].filter(val => val && val.toString().trim() !== "");
                    const descripcionGenerada = partesDesc.join(" - ");

                    datosParaExcel.push({
                        "Fecha de Salida": prenda.salidaFecha || "",
                        "Remisión de Salida": prenda.salidaRemision || "",
                        "Tipo de Salida / Destino": prenda.estado || "",
                        "Orden de Traslado (TO)": prenda.salidaTo || "", 
                        "Fecha Ingreso Original": prenda.fechaIngreso || "",
                        "Registrado Por": prenda.registradoPor || "",
                        "Precinto": prenda.precinto || "",
                        "Descripción": descripcionGenerada,
                        "Referencia": prenda.referencia || "",
                        "Línea": prenda.linea || "",
                        "Color": prenda.color || "",
                        "Talla": prenda.talla || "",
                        "Género": prenda.genero || "",
                        "Proveedor": prenda.proveedor || "",
                        "País Origen": prenda.paisOrigen || "",
                        "Precio": prenda.precio || "",
                        "Moneda": prenda.moneda || "",
                        "Cantidad": prenda.cantidad || "",
                        "Clasificación": prenda.clasificacion || "",
                        "Ubicación General": prenda.ubicacionGeneral || "",
                        "Ubicación Diseño": prenda.ubicacionDiseno || "",
                        "Tipo": prenda.tipo || "",
                        "Observaciones": prenda.observaciones || "",
                        "Colección": prenda.coleccion || ""
                    });
                }
            });

            if (contadorBajas === 0) {
                tabla.innerHTML = "<tr><td colspan='9' style='text-align:center; padding: 20px; color:#aaa;'>No hay registros de bajas en este momento.</td></tr>";
            }
        }

        // 3. SUSCRIPCIÓN EN TIEMPO REAL
        supabase
            .channel('cambios-bajas')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'prendas' }, payload => {
                fetchBajas(); 
            })
            .subscribe();

        // INICIAR CARGA DE DATOS
        fetchBajas();

        // 4. FUNCIÓN MÁGICA: Devuelve la prenda al inventario activo
        window.retornarAInventario = async function(idDocumento) {
            if (confirm("¿Quieres reversar esta baja y retornar la prenda como DISPONIBLE EN BODEGA?")) {
                const { error } = await supabase
                    .from('prendas')
                    .update({
                        estado: "Disponible en inventario",
                        salidaRemision: "",
                        salidaFecha: "",
                        salidaTo: "" 
                    })
                    .eq('id', idDocumento);

                if (error) {
                    alert("Error al intentar retornar: " + error.message);
                } else {
                    alert("¡Acción realizada! La prenda regresó al inventario disponible. 🟢");
                }
            }
        }

        // 5. EXPORTAR A EXCEL
        document.getElementById('btnExportarExcel').addEventListener('click', function() {
            if(datosParaExcel.length === 0) { alert("No hay registros de bajas para exportar."); return; }
            const hojaTrabajo = XLSX.utils.json_to_sheet(datosParaExcel);
            const libroExcel = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libroExcel, hojaTrabajo, "Historial Bajas");
            XLSX.writeFile(libroExcel, "Historial_Bajas_Monastery.xlsx");
        });

        // 6. IMPORTAR MASIVAMENTE DESDE EXCEL
        document.getElementById('inputImportarExcel').addEventListener('change', async function(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = async function(e) {
                try {
                    mensajeCarga.textContent = "Procesando Excel masivo... ⏳";
                    mensajeCarga.style.display = "block";

                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const excelData = XLSX.utils.sheet_to_json(worksheet);

                    if (excelData.length === 0) {
                        alert("El archivo Excel está vacío o no tiene el formato correcto.");
                        mensajeCarga.style.display = "none";
                        return;
                    }

                    if (confirm(`⚠️ Vas a importar ${excelData.length} prendas al sistema desde este Excel.\n\n¿Deseas continuar?`)) {
                        
                        const registrosLimpios = excelData.map(fila => {
                            return {
                                registradoPor: fila["Registrado Por"] || fila["registradoPor"] || "",
                                fechaIngreso: fila["Fecha Ingreso Original"] || fila["Fecha Ingreso"] || new Date().toLocaleDateString('en-CA'),
                                precinto: fila["Precinto"] || fila["precinto"] || "",
                                referencia: fila["Referencia"] || fila["referencia"] || "",
                                coleccion: fila["Colección"] || fila["coleccion"] || "",
                                tipo: fila["Tipo"] || fila["tipo"] || "",
                                linea: fila["Línea"] || fila["linea"] || "",
                                talla: fila["Talla"] || fila["talla"] || "",
                                genero: fila["Género"] || fila["genero"] || "",
                                color: fila["Color"] || fila["color"] || "",
                                cantidad: parseInt(fila["Cantidad"] || fila["cantidad"]) || 1,
                                clasificacion: fila["Clasificación"] || fila["clasificacion"] || "",
                                proveedor: fila["Proveedor"] || fila["proveedor"] || "",
                                paisOrigen: fila["País Origen"] || fila["paisOrigen"] || "",
                                precio: parseFloat(fila["Precio"] || fila["precio"]) || null,
                                moneda: fila["Moneda"] || fila["moneda"] || "COP",
                                ubicacionGeneral: fila["Ubicación General"] || fila["ubicacionGeneral"] || "",
                                ubicacionDiseno: fila["Ubicación Diseño"] || fila["ubicacionDiseno"] || "",
                                observaciones: fila["Observaciones"] || fila["observaciones"] || "",
                                estado: fila["Tipo de Salida / Destino"] || fila["Estado Actual"] || fila["estado"] || "SALIDA DEL INVENTARIO",
                                salidaRemision: fila["Remisión de Salida"] || fila["salidaRemision"] || "",
                                salidaFecha: fila["Fecha de Salida"] || fila["salidaFecha"] || "",
                                salidaTo: fila["Orden de Traslado (TO)"] || fila["salidaTo"] || ""
                            };
                        });

                        const { error } = await supabase.from('prendas').insert(registrosLimpios);
                        if (error) throw error;
                        alert(`🎉 ¡Importación Masiva Exitosa! Se añadieron ${registrosLimpios.length} prendas al sistema.`);
                    }
                } catch (err) {
                    console.error("Error al importar Excel:", err);
                    alert("Ocurrió un error leyendo el Excel. Revisa que el formato de columnas sea el correcto.\n" + err.message);
                } finally {
                    event.target.value = ''; 
                    mensajeCarga.style.display = "none";
                }
            };
            lector.readAsArrayBuffer(archivo);
        });

        // BUSCADOR EN TIEMPO REAL
        document.getElementById('inputBuscador').addEventListener('input', function() {
            const textoBusqueda = this.value.toLowerCase();
            const filas = document.querySelectorAll('#cuerpoTablaSalidas tr');
            filas.forEach(fila => {
                if (fila.textContent.toLowerCase().includes(textoBusqueda)) { 
                    fila.style.display = ''; 
                } else { 
                    fila.style.display = 'none'; 
                }
            });
        });
    </script>
</body>
</html>
