<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso · Auditorías</title>
<link rel="icon" type="image/png" href="icono-192.png">
<meta name="theme-color" content="#15100E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --tinta: #15100E; --hueso: #FDFBF7; --laton: #B08945; --laton-hover: #9A7638;
        --borde: #E6E1D8; --texto: #2A2421; --texto-claro: #736961;
        --transicion: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; font-family: 'Inter', sans-serif; background: #EAE6DF;
        color: var(--texto); display: flex; align-items: center; justify-content: center;
        min-height: 100vh; background-image: radial-gradient(circle at top, #FDFBF7 0%, #EAE6DF 100%);
    }
    .login-caja {
        background: #fff; width: 100%; max-width: 400px; padding: 40px;
        border-radius: 16px; box-shadow: 0 12px 32px rgba(21,16,14,0.08);
        text-align: center; border: 1px solid #fff;
    }
    .logo {
        font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 400;
        letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 8px 0; color: var(--tinta);
    }
    .subtitulo { font-size: 13px; color: var(--texto-claro); margin-bottom: 32px; letter-spacing: 0.05em; text-transform: uppercase; }
    
    .campo { text-align: left; margin-bottom: 20px; }
    .campo label { display: block; font-size: 11px; font-weight: 600; color: var(--texto-claro); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .campo input {
        width: 100%; padding: 14px 16px; font-size: 15px; border: 1px solid var(--borde);
        border-radius: 8px; background: #FAFAFA; color: var(--texto); font-family: inherit;
        transition: var(--transicion); outline: none;
    }
    .campo input:focus { border-color: var(--laton); background: #fff; box-shadow: 0 0 0 3px rgba(176,137,69,0.1); }
    
    .btn {
        width: 100%; padding: 14px; font-size: 15px; font-weight: 600; font-family: inherit;
        background: var(--tinta); color: var(--hueso); border: none; border-radius: 8px;
        cursor: pointer; transition: var(--transicion); margin-top: 10px;
    }
    .btn:hover { background: #000; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.15); }
    .btn:disabled { background: #A39C94; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .mensaje { margin-top: 20px; font-size: 13px; padding: 12px; border-radius: 8px; display: none; }
    .mensaje.error { display: block; background: #FCF0F0; color: #8C2026; border: 1px solid #E8C4C6; }
</style>
</head>
<body>

<div class="login-caja">
    <h1 class="logo">Monastery</h1>
    <div class="subtitulo">Sistema de Auditorías</div>
    
    <div class="campo">
        <label>Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@monastery.com" autocomplete="email">
    </div>
    <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    
    <button class="btn" id="btnIngresar">Ingresar</button>
    <div id="errorMsg" class="mensaje"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient('https://emljzsxypeqecevffmwr.supabase.co', 'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W');

const $ = id => document.getElementById(id);

// Redirigir si ya hay sesión
const { data: { session } } = await supabase.auth.getSession();
if (session) location.replace('agenda.html');

$('btnIngresar').addEventListener('click', async () => {
    const email = $('email').value.trim();
    const password = $('password').value;
    const btn = $('btnIngresar');
    const msg = $('errorMsg');
    
    msg.className = 'mensaje';
    if (!email || !password) {
        msg.textContent = 'Por favor ingresa correo y contraseña.';
        msg.className = 'mensaje error';
        return;
    }

    btn.disabled = true; btn.textContent = 'Verificando...';

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
        msg.textContent = 'Credenciales incorrectas. Verifica tus datos.';
        msg.className = 'mensaje error';
        btn.disabled = false; btn.textContent = 'Ingresar';
    } else {
        location.replace('agenda.html');
    }
});

// Permitir Enter
$('password').addEventListener('keypress', e => { if (e.key === 'Enter') $('btnIngresar').click(); });
</script>
</body>
</html>
