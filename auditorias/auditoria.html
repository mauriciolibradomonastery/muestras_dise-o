<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditoría · Monastery</title>
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15100E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --tinta:#15100E; --hueso:#EDE7DD; --vino:#6E1F24; --laton:#B08945;
        --humo:rgba(237,231,221,.55); --linea:rgba(237,231,221,.14);
        --papel:#F6F4F1; --texto:#241E1A; --borde:#E2DCD4;
        --azul:#1E3A8A; --verde:#197A56; --ambar:#B45309;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:'Inter','Segoe UI',sans-serif; background:var(--papel); color:var(--texto);
        padding-bottom:calc(96px + env(safe-area-inset-bottom)); }

    .barra { background:var(--tinta); color:var(--hueso); padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
        position:sticky; top:0; z-index:30; }
    .barra-fila { display:flex; align-items:center; gap:12px; }
    .volver { background:none; border:none; color:var(--hueso); font-size:20px; cursor:pointer; padding:4px 8px; }
    .barra h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:300; font-size:21px; margin:0; flex:1; line-height:1.2; }
    .barra .sub { font-size:12px; color:var(--humo); margin-top:3px; }

    .pasos { display:flex; gap:6px; margin-top:12px; }
    .paso-punto { flex:1; height:3px; background:var(--linea); border-radius:2px; }
    .paso-punto.activo { background:var(--laton); }
    .paso-punto.hecho { background:rgba(176,137,69,.5); }

    .contenido { padding:16px; max-width:820px; margin:0 auto; }
    .tarjeta { background:#fff; border:1px solid var(--borde); border-radius:8px; padding:16px; margin-bottom:14px; }
    .tarjeta h2 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:20px; margin:0 0 4px; }
    .tarjeta .ayuda { font-size:12.5px; color:#7A736B; margin-bottom:14px; }

    label { display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
        color:#6F675F; margin-bottom:6px; }
    input, select, textarea { width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--borde);
        border-radius:6px; font-family:inherit; color:var(--texto); background:#fff; outline:none; }
    input:focus, select:focus, textarea:focus { border-color:var(--laton); }
    textarea { min-height:90px; resize:vertical; }
    .fila { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .fila-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px; }

    .btn { font-family:inherit; font-size:14px; padding:11px 16px; border-radius:6px; border:1px solid var(--borde);
        background:#fff; color:var(--texto); cursor:pointer; }
    .btn:hover { background:var(--papel); }
    .btn-oscuro { background:var(--tinta); color:var(--hueso); border-color:var(--tinta); }
    .btn-laton { background:var(--laton); color:#1a1512; border:none; font-weight:600; }
    .btn-chico { padding:7px 11px; font-size:12.5px; }

    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th { text-align:left; font-size:11px; font-weight:600; color:#6F675F; text-transform:uppercase;
        padding:8px 6px; border-bottom:1px solid var(--borde); }
    td { padding:6px; border-bottom:1px solid #F1EEEA; }
    td input { padding:8px; font-size:15px; text-align:center; }
    .tabla-scroll { overflow-x:auto; margin:0 -6px; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .quitar { background:none; border:none; color:#B9B2AA; font-size:16px; cursor:pointer; padding:4px 8px; }
    .quitar:hover { color:var(--vino); }

    .cifras { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-top:6px; }
    .cifra { background:var(--papel); border-radius:6px; padding:11px 12px; }
    .cifra .n { font-size:20px; font-weight:600; line-height:1; }
    .cifra .t { font-size:11px; color:#7A736B; margin-top:4px; }
    .cifra.menor .n { color:var(--ambar); }
    .cifra.mayor .n { color:#C2410C; }
    .cifra.critico .n { color:var(--vino); }

    .pastilla { display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; }
    .pastilla.menor { background:#FEF6E7; color:var(--ambar); }
    .pastilla.mayor { background:#FDEDE4; color:#C2410C; }
    .pastilla.critico { background:#FCF0F0; color:var(--vino); }

    /* Estilos Multi-talla */
    .tallas-inputs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .talla-item { display: flex; flex-direction: column; align-items: center; background: #fff; border: 1px solid var(--borde); border-radius: 6px; padding: 6px 8px; }
    .talla-item span { font-size: 11px; font-weight: 600; color: #6F675F; margin-bottom: 4px; }
    .talla-item input { width: 45px; padding: 6px; font-size: 15px; text-align: center; border: 1px solid var(--borde); border-radius: 4px; background: #F6F4F1;}
    .talla-item input:focus { border-color: var(--laton); background: #fff; outline: none; }

    /* Fotos con observaciones */
    .fotos { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:12px; }
    .foto-box { background: var(--papel); border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;}
    .foto { position:relative; aspect-ratio:3/4; overflow:hidden; background:#000; }
    .foto img { width:100%; height:100%; object-fit:contain; }
    .foto button { position:absolute; top:6px; right:6px; background:rgba(21,16,14,.8); color:#fff;
        border:none; border-radius:50%; width:28px; height:28px; font-size:14px; cursor:pointer; }
    .foto-obs { padding: 8px; border-top: 1px solid var(--borde); }
    .foto-obs input { font-size: 12px; padding: 6px 8px; border: none; border-radius: 4px; background: #fff; width: 100%; }
    
    .agregar-foto { aspect-ratio:3/4; border:2px dashed var(--borde); border-radius:8px; background:none;
        color:#9C958D; font-size:13px; cursor:pointer; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:6px; font-family:inherit; min-height: 160px;}

    .resultado-botones { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .resultado-botones button { padding:18px; border-radius:8px; border:2px solid var(--borde); background:#fff;
        font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; }
    .resultado-botones button.sel-aprobado { border-color:var(--verde); background:#EEF7F2; color:var(--verde); }
    .resultado-botones button.sel-rechazado { border-color:var(--vino); background:#FCF0F0; color:var(--vino); }

    .pie-fijo { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--borde);
        padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px;
        justify-content:space-between; z-index:25; }
    .pie-fijo .btn, .pie-fijo .btn-laton { flex:1; max-width:220px; }
    .mensaje { display:none; padding:11px 13px; border-radius:6px; font-size:13px; margin-bottom:12px; }
    .mensaje.info { display:block; background:#F2F5FC; color:#1E3A8A; border:1px solid #CBD9F5; }
    .cargando { padding:50px; text-align:center; color:#8A8279; }
    .oculto { display:none !important; }

    @media (max-width:640px) { .fila, .fila-3 { grid-template-columns:1fr; } .contenido { padding:14px; } }
</style>
</head>
<body>

<div class="barra">
    <div class="barra-fila">
        <button class="volver" id="btnVolver">‹</button>
        <div style="flex:1">
            <h1 id="titulo">Auditoría</h1>
            <div class="sub" id="subtitulo"></div>
        </div>
    </div>
    <div class="pasos" id="pasos"></div>
</div>

<div class="contenido" id="contenido"><div class="cargando">Cargando…</div></div>

<div class="pie-fijo oculto" id="pieFijo">
    <button class="btn" id="btnAtras">Atrás</button>
    <button class="btn-laton btn" id="btnSiguiente">Siguiente</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
    'https://emljzsxypeqecevffmwr.supabase.co',
    'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W',
    { auth: { storage: window.localStorage } }
);

const $ = id => document.getElementById(id);
const BUCKET = 'auditorias-evidencias';
const SEVERIDADES = [['menor','Menor'], ['mayor','Mayor'], ['critico','Crítico']];
const idAuditoria = +new URLSearchParams(location.search).get('id');

let yo = null, auditoria = null, catalogo = [];
let cantidades = [];     
let defectos = [];       
let evidencias = [];     
let tallas = [];         
let paso = 1;

const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
const fmt = n => Math.round(n).toLocaleString('es-CO');
const esc = t => String(t ?? '').replace(/[<>"]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const { data: { session } } = await supabase.auth.getSession();
if (!session) location.replace('index.html');
const { data } = await supabase.from('auditoria_usuarios').select('id, nombre, rol, activo').eq('id', session.user.id).maybeSingle();
yo = data;

$('btnVolver').addEventListener('click', () => location.href = 'agenda.html');

async function cargar() {
    if (!idAuditoria) return;

    const [{ data: aud }, { data: cat }, { data: cant }, { data: def }, { data: evi }] = await Promise.all([
        supabase.from('auditorias').select('*, auditoria_proveedores(nombre), auditoria_tipos(nombre)').eq('id', idAuditoria).maybeSingle(),
        supabase.from('auditoria_catalogo_defectos').select('nombre, severidad').eq('activo', true).order('nombre'),
        supabase.from('auditoria_cantidades').select('*').eq('auditoria_id', idAuditoria),
        supabase.from('auditoria_defectos').select('*').eq('auditoria_id', idAuditoria).order('id'),
        supabase.from('auditoria_evidencias').select('*').eq('auditoria_id', idAuditoria).order('id'),
    ]);

    auditoria = aud; catalogo = cat || [];
    defectos = (def || []).map(d => ({ ...d })); evidencias = (evi || []).map(e => ({ ...e }));

    if (cant && cant.length) {
        const mapa = {};
        cant.forEach(c => { mapa[c.color] = mapa[c.color] || { color: c.color, tallas: {} }; mapa[c.color].tallas[c.talla] = num(c.cantidad); });
        cantidades = Object.values(mapa);
    } else {
        cantidades = await traerDeProduccion(aud.referencia);
    }
    recalcularTallas();

    $('titulo').textContent = auditoria.referencia || 'Auditoría';
    $('subtitulo').textContent = [auditoria.auditoria_proveedores?.nombre, auditoria.auditoria_tipos?.nombre].filter(Boolean).join(' · ');

    if (auditoria.estado === 'programada') {
        await supabase.from('auditorias').update({ estado: 'en_curso', fecha_auditoria: new Date().toLocaleDateString('sv') }).eq('id', idAuditoria);
        auditoria.estado = 'en_curso';
    }
    $('pieFijo').classList.remove('oculto'); pintar();
}

async function traerDeProduccion(referencia) {
    if (!referencia) return [];
    const { data } = await supabase.from('produccion').select('color, tallas').ilike('descripcion', referencia.trim());
    const mapa = {};
    (data || []).forEach(r => {
        const color = (r.color || 'sin color').trim();
        mapa[color] = mapa[color] || { color, tallas: {} };
        Object.entries(r.tallas || {}).forEach(([t, c]) => mapa[color].tallas[t] = (mapa[color].tallas[t] || 0) + num(c));
    });
    return Object.values(mapa);
}

function recalcularTallas() {
    const orden = ['XS','S','M','L','XL','XXL','XXXL','U','2','4','6','8','10','12','14','16','28','30','32','34','36','38','40','42','44'];
    const usadas = new Set(); cantidades.forEach(c => Object.keys(c.tallas).forEach(t => usadas.add(t)));
    tallas = [...usadas].sort((a, b) => { const ia = orden.indexOf(a), ib = orden.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); });
}

const totalLote = () => cantidades.reduce((s, c) => s + Object.values(c.tallas).reduce((x, v) => x + num(v), 0), 0);
const colores = () => cantidades.map(c => c.color);

function pintar() {
    $('pasos').innerHTML = [1,2,3,4].map(p => `<div class="paso-punto ${p === paso ? 'activo' : p < paso ? 'hecho' : ''}"></div>`).join('');
    $('btnAtras').style.visibility = paso === 1 ? 'hidden' : 'visible';$('btnSiguiente').textContent = paso === 4 ? 'Finalizar auditoría' : 'Siguiente';
    ({ 1: pasoLote, 2: pasoAuditado, 3: pasoDefectos, 4: pasoCierre })[paso]();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- Paso 1 ---
function pasoLote() {
    $('contenido').innerHTML = `
    <div class="tarjeta">
        <h2>1 · Datos del lote</h2>
        <div class="fila">
            <div><label>Referencia</label><input id="eRef" value="${esc(auditoria.referencia || '')}"></div>
            <div><label>SKU</label><input id="eSku" value="${esc(auditoria.sku || '')}"></div>
        </div>
        <div class="fila">
            <div><label>Sublínea</label><input id="eSublinea" value="${esc(auditoria.sublinea || '')}"></div>
            <div><label>N° factura</label><input id="eFactura" value="${esc(auditoria.numero_factura || '')}"></div>
        </div>
    </div>
    <div class="tarjeta">
        <h2>Cantidades por color y talla</h2>
        <div class="tabla-scroll">
            <table>
                <thead><tr><th>Color</th>${tallas.map(t => `<th class="num">${t}</th>`).join('')}<th class="num">Total</th><th></th></tr></thead>
                <tbody>
                ${cantidades.map((c, i) => `<tr>
                    <td><input value="${esc(c.color)}" onchange="cambiarColor(${i}, this.value)" style="min-width:110px"></td>
                    ${tallas.map(t => `<td><input type="number" min="0" style="width:72px" value="${c.tallas[t] ?? ''}" onchange="cambiarCantidad(${i},'${t}',this.value)"></td>`).join('')}
                    <td class="num"><b>${fmt(Object.values(c.tallas).reduce((s,v) => s + num(v), 0))}</b></td>
                    <td><button class="quitar" onclick="quitarColor(${i})">✕</button></td>
                </tr>`).join('')}
                </tbody>
            </table>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn btn-chico" onclick="agregarColor()">+ Color</button>
            <button class="btn btn-chico" onclick="agregarTalla()">+ Talla</button>
        </div>
    </div>`;
}

window.cambiarColor = (i, v) => { cantidades[i].color = v.trim().toUpperCase(); };
window.cambiarCantidad = (i, t, v) => { if (v === '') delete cantidades[i].tallas[t]; else cantidades[i].tallas[t] = num(v); pintar(); };
window.quitarColor = i => { cantidades.splice(i, 1); recalcularTallas(); pintar(); };
window.agregarColor = () => { cantidades.push({ color: 'NUEVO', tallas: {} }); pintar(); };
window.agregarTalla = () => { const t = prompt('Talla:'); if (t) { tallas.push(t.toUpperCase()); pintar(); } };

// --- Paso 2 ---
function pasoAuditado() {
    const lote = totalLote(); const auditada = num(auditoria.cantidad_auditada);
    $('contenido').innerHTML = `
    <div class="tarjeta"><h2>2 · Cantidad auditada</h2>
        <input id="eAuditada" type="number" min="0" value="${auditada || ''}" oninput="calcularPct(${lote})" style="font-size:22px; text-align:center; padding:16px">
        <div class="cifras"><div class="cifra"><div class="n" id="pctAuditado">${lote ? (auditada / lote * 100).toFixed(1) : '0'} %</div><div class="t">Del lote (${fmt(lote)})</div></div></div>
        <div style="display:flex; gap:8px; margin-top:14px;">${[10, 25, 50, 100].map(p => `<button class="btn btn-chico" onclick="$('eAuditada').value=${Math.round(lote*p/100)};calcularPct(${lote})">${p} %</button>`).join('')}</div>
    </div>`;
}
window.calcularPct = l => $('pctAuditado').textContent = (l ? num($('eAuditada').value) / l * 100 : 0).toFixed(1) + ' %';

// --- Paso 3 ---
function pasoDefectos() {
    const cols = colores();
    const autoColor = cols.length === 1 ? cols[0] : '';

    $('contenido').innerHTML = `
    <div class="tarjeta">
        <h2>3 · Agregar defectos</h2>
        <div class="fila">
            <div><label>Severidad</label><select id="dSeveridad">${SEVERIDADES.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select></div>
            <div><label>Defecto</label><input id="dDefecto" list="listaDefectos"><datalist id="listaDefectos">${catalogo.map(c => `<option value="${esc(c.nombre)}">`).join('')}</datalist></div>
        </div>
        <div class="fila">
            <div><label>Color</label><select id="dColor">${cols.length!==1?'<option value="">Elegir...</option>':''}${cols.map(c => `<option ${c===autoColor?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        </div>
        
        <label>Cantidades por talla</label>
        <div class="tallas-inputs">
            ${tallas.map(t => `
                <div class="talla-item">
                    <span>${t}</span>
                    <input type="number" min="0" class="input-talla-defecto" data-talla="${t}">
                </div>
            `).join('')}
        </div>
        <button class="btn btn-oscuro" style="width:100%; margin-top:8px;" onclick="agregarDefecto()">+ Agregar Defecto</button>
    </div>

    <div class="tarjeta">
        <h2>Registrados (${defectos.length})</h2>
        <div class="tabla-scroll"><table>
            <thead><tr><th>Sev.</th><th>Defecto</th><th>Color</th><th>Talla</th><th class="num">Cant.</th><th></th></tr></thead>
            <tbody>${defectos.map((d, i) => `<tr>
                <td><span class="pastilla ${d.severidad}">${d.severidad}</span></td>
                <td>${esc(d.defecto)}</td><td>${esc(d.color)}</td><td>${esc(d.talla)}</td><td class="num">${fmt(d.cantidad)}</td>
                <td><button class="quitar" onclick="quitarDefecto(${i})">✕</button></td>
            </tr>`).join('')}</tbody>
        </table></div>
    </div>`;
}

window.agregarDefecto = () => {
    const defecto = $('dDefecto').value.trim();
    const color = $('dColor').value;
    const severidad = $('dSeveridad').value;

    if (!defecto || !color) return alert('Verifica que el defecto y el color estén seleccionados.');

    const inputsTallas = document.querySelectorAll('.input-talla-defecto');
    let agregados = 0;

    inputsTallas.forEach(input => {
        const cantidad = num(input.value);
        if (cantidad > 0) {
            defectos.push({ 
                severidad: severidad, 
                defecto: defecto.toLowerCase(), 
                color: color, 
                talla: input.dataset.talla, 
                cantidad: cantidad 
            });
            agregados++;
        }
    });

    if (agregados === 0) return alert('Ingresa la cantidad en al menos una de las tallas.');
    pintar();
};

window.quitarDefecto = i => { defectos.splice(i, 1); pintar(); };

// --- Paso 4 ---
function pasoCierre() {
    $('contenido').innerHTML = `
    <div class="tarjeta"><h2>Observaciones Generales</h2>
        <textarea id="eObservaciones">${esc(auditoria.observaciones || '')}</textarea>
    </div>
    <div class="tarjeta">
        <h2>Evidencias (${evidencias.length})</h2>
        <input type="file" id="archivoFoto" accept="image/*" capture="environment" multiple class="oculto" onchange="subirFotos(event)">
        <div class="fotos">
            ${evidencias.map((e, i) => `
                <div class="foto-box">
                    <div class="foto"><img src="${e.url}"><button onclick="quitarEvidencia(${i})">✕</button></div>
                    <div class="foto-obs"><input type="text" placeholder="Nota a esta foto..." value="${esc(e.observacion)}" onchange="guardarObsFoto(${i}, this.value)"></div>
                </div>`).join('')}
            <button class="agregar-foto" onclick="$('archivoFoto').click()"><span>📷</span>Agregar Foto</button>
        </div>
        <div class="mensaje" id="avisoFoto"></div>
    </div>
    <div class="tarjeta"><h2>Resultado</h2>
        <div class="resultado-botones">
            <button id="btnAprobado" class="${auditoria.resultado === 'aprobado' ? 'sel-aprobado' : ''}" onclick="elegirResultado('aprobado')">Aprobado</button>
            <button id="btnRechazado" class="${auditoria.resultado === 'rechazado' ? 'sel-rechazado' : ''}" onclick="elegirResultado('rechazado')">Rechazado</button>
        </div>
    </div>`;
}

window.elegirResultado = r => { auditoria.resultado = r; $('btnAprobado').className = r === 'aprobado' ? 'sel-aprobado' : '';$('btnRechazado').className = r === 'rechazado' ? 'sel-rechazado' : ''; };
window.guardarObsFoto = (i, val) => { evidencias[i].observacion = val; };

window.subirFotos = async function(e) {
    const archivos = [...e.target.files]; if (!archivos.length) return;
    $('avisoFoto').className = 'mensaje info';
    for (let i = 0; i < archivos.length; i++) {
        $('avisoFoto').textContent = `Subiendo ${i + 1} de ${archivos.length}…`;
        const nombre = `${idAuditoria}/${Date.now()}_${i}.jpg`;
        const { error } = await supabase.storage.from(BUCKET).upload(nombre, archivos[i]);
        if (!error) {
            const url = supabase.storage.from(BUCKET).getPublicUrl(nombre).data.publicUrl;
            const { data } = await supabase.from('auditoria_evidencias').insert({ auditoria_id: idAuditoria, url, nombre: archivos[i].name, observacion: '' }).select().single();
            evidencias.push(data || { url, observacion: '' });
        }
    }
    $('archivoFoto').value = ''; pintar();
};
window.quitarEvidencia = async i => { if(confirm('¿Quitar foto?')) { if (evidencias[i].id) await supabase.from('auditoria_evidencias').delete().eq('id', evidencias[i].id); evidencias.splice(i, 1); pintar(); } };

// ---------- Guardado ----------
async function guardarPaso() {
    if (paso === 1) {
        auditoria.referencia = ($('eRef').value || '').toUpperCase();
        auditoria.sku = ($('eSku').value || '').toUpperCase();
        auditoria.sublinea = ($('eSublinea').value || '').toUpperCase();
        auditoria.cantidad_produccion = totalLote();
        await supabase.from('auditorias').update({ referencia: auditoria.referencia, sku: auditoria.sku, sublinea: auditoria.sublinea, cantidad_produccion: auditoria.cantidad_produccion }).eq('id', idAuditoria);
        await supabase.from('auditoria_cantidades').delete().eq('auditoria_id', idAuditoria);
        const filas = []; cantidades.forEach(c => Object.entries(c.tallas).forEach(([t, cant]) => { if (num(cant)>0) filas.push({ auditoria_id: idAuditoria, color: c.color, talla: t, cantidad: num(cant) }); }));
        if (filas.length) await supabase.from('auditoria_cantidades').insert(filas);
    }
    if (paso === 2) { auditoria.cantidad_auditada = num($('eAuditada').value); await supabase.from('auditorias').update({ cantidad_auditada: auditoria.cantidad_auditada }).eq('id', idAuditoria); }
    if (paso === 3) {
        await supabase.from('auditoria_defectos').delete().eq('auditoria_id', idAuditoria);
        if (defectos.length) await supabase.from('auditoria_defectos').insert(defectos.map(d => ({ auditoria_id: idAuditoria, severidad: d.severidad, defecto: d.defecto, color: d.color, talla: d.talla, cantidad: d.cantidad })));
    }
    if (paso === 4) {
        auditoria.observaciones = $('eObservaciones').value;
        await supabase.from('auditorias').update({ observaciones: auditoria.observaciones }).eq('id', idAuditoria);
        // Guardar observaciones de cada foto individual
        await Promise.all(evidencias.map(e => {
            if (e.id) return supabase.from('auditoria_evidencias').update({ observacion: e.observacion }).eq('id', e.id);
        }));
    }
}

$('btnAtras').addEventListener('click', async () => { await guardarPaso(); paso--; pintar(); });
$('btnSiguiente').addEventListener('click', async () => {$('btnSiguiente').disabled = true;
    await guardarPaso();
    if (paso === 4) {
        if (!auditoria.resultado) { $('btnSiguiente').disabled = false; return alert('Elige el resultado.'); }
        await supabase.from('auditorias').update({ estado: 'finalizada', resultado: auditoria.resultado }).eq('id', idAuditoria);
        location.href = 'agenda.html'; return;
    }
    paso++; $('btnSiguiente').disabled = false; pintar();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
await cargar();
</script>
