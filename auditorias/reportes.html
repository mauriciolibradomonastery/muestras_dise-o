<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reportes · Auditorías</title>
<link rel="icon" type="image/png" href="icono-192.png">
<meta name="theme-color" content="#15100E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Importar Chart.js para los gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root {
        --tinta: #15100E; --hueso: #EDE7DD; --vino: #6E1F24; --laton: #B08945;
        --papel: #F6F4F1; --texto: #241E1A; --borde: #E2DCD4;
        --verde: #197A56; 
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--papel); color: var(--texto); padding-bottom: 30px;}
    
    .barra { background: var(--tinta); color: var(--hueso); padding: 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30;}
    .barra h1 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin: 0; }
    .volver { background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 13px;}
    
    .contenido { padding: 18px; max-width: 1200px; margin: 0 auto; }
    
    .seccion { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 20px; margin-bottom: 20px;}
    .seccion h2 { font-family: 'Cormorant Garamond', serif; margin: 0 0 16px 0; font-size: 22px;}
    
    .filtros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .filtros-grid label { font-size: 11px; font-weight: 700; color: #6F675F; letter-spacing: 0.05em; display: block; margin-bottom: 6px;}
    select { padding: 10px; border: 1px solid var(--borde); border-radius: 6px; font-family: inherit; width: 100%;}
    
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px;}
    .kpi { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 18px; border-top: 4px solid var(--laton);}
    .kpi .num { font-size: 28px; font-weight: 600; margin-bottom: 4px;}
    .kpi .titulo { font-size: 12px; color: #6F675F; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;}

    /* Contenedor de gráficos */
    .graficos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .grafico-caja { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; align-items: center;}
    .grafico-caja h3 { font-family: 'Cormorant Garamond', serif; font-size: 18px; margin: 0 0 16px 0; width: 100%; text-align: left;}
    .canvas-container { position: relative; width: 100%; height: 300px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;}
    th { padding: 10px; border-bottom: 2px solid var(--borde); color: #6F675F; }
    td { padding: 10px; border-bottom: 1px solid #F1EEEA; }
    
    .fila-clic { cursor: pointer; transition: background 0.2s; }
    .fila-clic:hover { background: #f9f8f6; }
    
    .estado-aprobado { color: var(--verde); font-weight: 600; background: #EEF7F2; padding: 4px 8px; border-radius: 4px;}
    .estado-rechazado { color: var(--vino); font-weight: 600; background: #FCF0F0; padding: 4px 8px; border-radius: 4px;}

    /* Estilos del Modal de Detalles */
    .fondo { display: none; position: fixed; inset: 0; background: rgba(21,16,14,.75); z-index: 60; align-items: center; justify-content: center; padding: 16px; }
    .fondo.abierto { display: flex; }
    .hoja { background: #fff; border-radius: 10px; width: 100%; max-width: 650px; max-height: 92vh; overflow: auto; display: flex; flex-direction: column;}
    .hoja-cabeza { padding: 16px 20px; border-bottom: 1px solid var(--borde); position: sticky; top: 0; background: #fff; display: flex; justify-content: space-between; align-items: center; z-index: 10;}
    .hoja-cabeza h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin: 0; }
    .cerrar { background: none; border: none; font-size: 20px; color: #9C958D; cursor: pointer; padding: 4px 8px; }
    .hoja-cuerpo { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
    
    .detalle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 14px;}
    .detalle-item { background: var(--papel); padding: 12px; border-radius: 6px; border: 1px solid var(--borde);}
    .detalle-item b { display: block; font-size: 11px; color: #6F675F; text-transform: uppercase; margin-bottom: 4px;}
    
    .seccion-detalle { border-top: 1px solid var(--borde); padding-top: 16px; }
    .seccion-detalle h4 { margin: 0 0 10px 0; font-size: 12px; color: #6F675F; text-transform: uppercase; letter-spacing: 0.05em;}
    
    .foto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .foto-card { border: 1px solid var(--borde); border-radius: 6px; overflow: hidden; background: #fff; }
    .foto-card img { width: 100%; height: 140px; object-fit: cover; display: block;}
    .foto-card p { margin: 0; padding: 8px; font-size: 12px; color: #6F675F; text-align: center; border-top: 1px solid var(--borde); background: #faf9f8;}
    
    .cargando { padding: 40px; text-align: center; color: #8A8279; }

    /* Tarjetas de Resumen de Defectos */
    .resumen-defectos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
    .caja-resumen { padding: 10px; border-radius: 6px; text-align: center; border: 1px solid; }
    .caja-resumen.menor { background: #FEF6E7; border-color: #B45309; }
    .caja-resumen.mayor { background: #FDEDE4; border-color: #C2410C; }
    .caja-resumen.critico { background: #FCF0F0; border-color: #6E1F24; }
    .caja-resumen.total { background: #f0f0f0; border-color: #ccc; }
    .caja-resumen b { display: block; font-size: 20px; line-height: 1; margin-bottom: 4px; }
    .caja-resumen span { font-size: 10px; text-transform: uppercase; font-weight: 600; }
    
    .caja-resumen.menor b, .caja-resumen.menor span { color: #B45309; }
    .caja-resumen.mayor b, .caja-resumen.mayor span { color: #C2410C; }
    .caja-resumen.critico b, .caja-resumen.critico span { color: #6E1F24; }
    .caja-resumen.total b, .caja-resumen.total span { color: #333; }

    @media (max-width: 768px) {
        .graficos-grid { grid-template-columns: 1fr; }
        .detalle-grid { grid-template-columns: 1fr; }
        .resumen-defectos { grid-template-columns: 1fr 1fr; }
    }
</style>
</head>
<body>

<div class="barra">
    <h1>Reportes y Desempeño</h1>
    <a href="agenda.html" class="volver">Volver a la Agenda</a>
</div>

<div class="contenido">
    <div class="seccion" style="padding-bottom: 20px;">
        <div class="filtros-grid">
            <div>
                <label>FILTRAR POR PROVEEDOR</label>
                <select id="filtroProv"><option value="ALL">Todos los proveedores</option></select>
            </div>
            <div>
                <label>FILTRAR POR REFERENCIA</label>
                <select id="filtroRef"><option value="ALL">Todas las referencias</option></select>
            </div>
            <div>
                <label>FILTRAR POR AUDITORA</label>
                <select id="filtroAuditor"><option value="ALL">Todas las auditoras</option></select>
            </div>
        </div>
    </div>

    <div class="kpis" id="panelKpis">
        <div class="kpi"><div class="num">...</div><div class="titulo">Cargando datos</div></div>
    </div>

    <div class="graficos-grid">
        <div class="grafico-caja">
            <h3>Ranking de Proveedores (Calificación)</h3>
            <div class="canvas-container">
                <canvas id="chartRanking"></canvas>
            </div>
        </div>
        <div class="grafico-caja">
            <h3>Top 5 Motivos de Defecto</h3>
            <div class="canvas-container">
                <canvas id="chartDefectos"></canvas>
            </div>
        </div>
    </div>

    <div class="grafico-caja" style="margin-bottom: 20px;">
        <h3>Evolución Mensual (Aprobadas vs Rechazadas)</h3>
        <div class="canvas-container">
            <canvas id="chartMeses"></canvas>
        </div>
    </div>

    <div class="seccion">
        <h2>Historial de Auditorías</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Proveedor</th>
                        <th>Referencia (SKU)</th>
                        <th>Auditora</th>
                        <th>Auditadas</th>
                        <th>Resultado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tablaAuditorias">
                    <tr><td colspan="7">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Detalles de Auditoría -->
<div class="fondo" id="modalDetalle">
    <div class="hoja">
        <div class="hoja-cabeza">
            <h2>Detalle de Revisión</h2>
            <button class="cerrar" id="btnCerrarDetalle">✕</button>
        </div>
        <div class="hoja-cuerpo" id="cuerpoDetalle">
            <!-- Aquí se inyectan los detalles -->
        </div>
    </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient('https://emljzsxypeqecevffmwr.supabase.co', 'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W');

const $ = function(id) { return document.getElementById(id); };

let auditorias = [];
let proveedoresMap = {};
let referenciasSet = new Set();
let auditorasMap = {};

let chartRankingInst = null;
let chartDefectosInst = null;
let chartMesesInst = null;

async function init() {
    // Validar sesion
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.replace('index.html'); return; }

    const { data: auds, error } = await supabase.from('auditorias')
        .select('*, auditoria_proveedores(nombre), auditoria_usuarios!auditora_id(nombre), auditoria_defectos(defecto, cantidad)')
        .eq('estado', 'finalizada')
        .order('fecha_auditoria', { ascending: false });

    if (error) {
        console.error(error);
        $('tablaAuditorias').innerHTML = '<tr><td colspan="7" style="color:#8C2026">Error al cargar: ' + error.message + '</td></tr>';
        $('panelKpis').innerHTML = '';
        return;
    }
    
    auditorias = auds;
    if (!auditorias) { auditorias = []; }
    
    // Poblar mapas de filtros
    auditorias.forEach(function(a) {
        if(a.auditoria_proveedores) proveedoresMap[a.proveedor_id] = a.auditoria_proveedores.nombre;
        if(a.auditoria_usuarios) auditorasMap[a.auditora_id] = a.auditoria_usuarios.nombre;
        if(a.referencia) referenciasSet.add(a.referencia);
    });
    
    // Llenar Select de Proveedores
    let htmlProv = '<option value="ALL">Todos los proveedores</option>';
    Object.entries(proveedoresMap).forEach(function([id, nombre]) { 
        htmlProv += '<option value="' + id + '">' + nombre + '</option>'; 
    });
    $('filtroProv').innerHTML = htmlProv;

    // Llenar Select de Referencias
    let htmlRef = '<option value="ALL">Todas las referencias</option>';
    let arrayRef = Array.from(referenciasSet).sort();
    arrayRef.forEach(function(ref) { 
        htmlRef += '<option value="' + ref + '">' + ref + '</option>'; 
    });
    $('filtroRef').innerHTML = htmlRef;

    // Llenar Select de Auditoras
    let htmlAud = '<option value="ALL">Todas las auditoras</option>';
    Object.entries(auditorasMap).forEach(function([id, nombre]) { 
        htmlAud += '<option value="' + id + '">' + nombre + '</option>'; 
    });
    $('filtroAuditor').innerHTML = htmlAud;

    renderData();
}

function renderData() {
    const valProv = $('filtroProv').value;
    const valRef = $('filtroRef').value;
    const valAud = $('filtroAuditor').value;

    const list = auditorias.filter(function(a) {
        const matchProv = valProv === 'ALL' || String(a.proveedor_id) === String(valProv);
        const matchRef = valRef === 'ALL' || a.referencia === valRef;
        const matchAud = valAud === 'ALL' || String(a.auditora_id) === String(valAud);
        return matchProv && matchRef && matchAud;
    });
    
    let totalLote = 0;
    let totalAuditado = 0;
    let totalDefectos = 0;
    let aprobadas = 0;
    let htmlTabla = '';
    
    const defectosCount = {};
    const mesesCount = {};

    list.forEach(function(a) {
        totalLote += Number(a.cantidad_produccion) || 0;
        totalAuditado += Number(a.cantidad_auditada) || 0;
        
        if (a.auditoria_defectos) {
            a.auditoria_defectos.forEach(function(d) {
                const defName = d.defecto ? d.defecto.toUpperCase() : 'NO ESPECIFICADO';
                const cant = Number(d.cantidad) || 0;
                totalDefectos += cant;
                defectosCount[defName] = (defectosCount[defName] || 0) + cant;
            });
        }
        
        const mes = a.fecha_auditoria ? a.fecha_auditoria.substring(0, 7) : 'Sin fecha';
        if (!mesesCount[mes]) { mesesCount[mes] = { aprobadas: 0, rechazadas: 0 }; }

        if(a.resultado === 'aprobado') {
            aprobadas++;
            mesesCount[mes].aprobadas++;
        } else {
            mesesCount[mes].rechazadas++;
        }

        const skuHtml = a.sku ? ' <small style="color:gray">(' + a.sku + ')</small>' : '';
        const provNombre = a.auditoria_proveedores ? a.auditoria_proveedores.nombre : 'N/A';
        const audNombre = a.auditoria_usuarios ? a.auditoria_usuarios.nombre : 'N/A';
        const resultadoClass = a.resultado ? a.resultado.toLowerCase() : '';
        const resultadoText = a.resultado ? a.resultado.toUpperCase() : 'N/A';
        const cantidadAuditada = a.cantidad_auditada || 0;

        htmlTabla += '<tr class="fila-clic" title="Clic para ver detalles" onclick="verDetalle(' + a.id + ')">' +
            '<td>' + a.fecha_auditoria + '</td>' +
            '<td>' + provNombre + '</td>' +
            '<td>' + (a.referencia || '') + skuHtml + '</td>' +
            '<td>' + audNombre + '</td>' +
            '<td>' + cantidadAuditada + '</td>' +
            '<td><span class="estado-' + resultadoClass + '">' + resultadoText + '</span></td>' +
            '<td style="color: var(--laton); text-align:right; font-weight: 600;">Ver ›</td>' +
        '</tr>';
    });

    if (!htmlTabla) { htmlTabla = '<tr><td colspan="7">No hay resultados para estos filtros.</td></tr>'; }
    $('tablaAuditorias').innerHTML = htmlTabla;

    const indiceDefectos = totalAuditado > 0 ? ((totalDefectos / totalAuditado) * 100).toFixed(2) : 0;
    const tamanoMuestra = totalLote > 0 ? ((totalAuditado / totalLote) * 100).toFixed(2) : 0;
    const calificacion = list.length > 0 ? ((aprobadas / list.length) * 100).toFixed(0) : 0;

    $('panelKpis').innerHTML = '<div class="kpi"><div class="num">' + list.length + '</div><div class="titulo">Auditorías Realizadas</div></div>' +
        '<div class="kpi" style="border-top-color: ' + (calificacion >= 80 ? '#197A56' : '#B45309') + '">' +
            '<div class="num">' + calificacion + '/100</div><div class="titulo">Calificación (Aprobaciones)</div>' +
        '</div>' +
        '<div class="kpi"><div class="num">' + indiceDefectos + '%</div><div class="titulo">Índice de Defectos</div></div>' +
        '<div class="kpi"><div class="num">' + tamanoMuestra + '%</div><div class="titulo">Tamaño de Muestra</div></div>';

    const topDefectos = Object.entries(defectosCount).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 5);

    const provScores = {};
    list.forEach(function(a) {
        const pName = a.auditoria_proveedores ? a.auditoria_proveedores.nombre : 'Desconocido';
        if(!provScores[pName]) { provScores[pName] = { total: 0, aprobadas: 0 }; }
        provScores[pName].total++;
        if(a.resultado === 'aprobado') { provScores[pName].aprobadas++; }
    });

    const ranking = Object.entries(provScores).map(function([nombre, datos]) {
        return {
            nombre: nombre,
            score: Math.round((datos.aprobadas / datos.total) * 100)
        };
    }).sort(function(a, b) { return b.score - a.score; });

    actualizarGraficos(ranking, topDefectos, mesesCount);
}

function actualizarGraficos(ranking, topDefectos, mesesCount) {
    if (chartRankingInst) chartRankingInst.destroy();
    if (chartDefectosInst) chartDefectosInst.destroy();
    if (chartMesesInst) chartMesesInst.destroy();

    const ctxRanking = document.getElementById('chartRanking').getContext('2d');
    chartRankingInst = new Chart(ctxRanking, {
        type: 'bar',
        data: {
            labels: ranking.map(function(r) { return r.nombre; }),
            datasets: [{
                label: 'Calificación',
                data: ranking.map(function(r) { return r.score; }),
                backgroundColor: ranking.map(function(r) { return r.score >= 80 ? '#197A56' : (r.score >= 50 ? '#B45309' : '#6E1F24'); }),
                borderRadius: 4
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { max: 100, ticks: { callback: function(value){return value+"%"} } } }
        }
    });

    const ctxDefectos = document.getElementById('chartDefectos').getContext('2d');
    if (topDefectos.length === 0) {
        chartDefectosInst = new Chart(ctxDefectos, {
            type: 'doughnut',
            data: { labels: ['Sin defectos'], datasets: [{ data: [1], backgroundColor: ['#E2DCD4'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { tooltip: {enabled: false} } }
        });
    } else {
        chartDefectosInst = new Chart(ctxDefectos, {
            type: 'doughnut',
            data: {
                labels: topDefectos.map(function(d) { return d[0]; }),
                datasets: [{
                    data: topDefectos.map(function(d) { return d[1]; }),
                    backgroundColor: ['#6E1F24', '#B45309', '#B08945', '#1E3A8A', '#197A56'],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } }
            }
        });
    }

    const ctxMeses = document.getElementById('chartMeses').getContext('2d');
    const mesesLabels = Object.keys(mesesCount).sort();
    const dataAprob = mesesLabels.map(function(m) { return mesesCount[m].aprobadas; });
    const dataRech = mesesLabels.map(function(m) { return mesesCount[m].rechazadas; });

    chartMesesInst = new Chart(ctxMeses, {
        type: 'bar',
        data: {
            labels: mesesLabels,
            datasets: [
                { label: 'Aprobadas', data: dataAprob, backgroundColor: '#197A56', borderRadius: 4 },
                { label: 'Rechazadas', data: dataRech, backgroundColor: '#6E1F24', borderRadius: 4 }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
    });
}

window.verDetalle = async function(id) {
    $('modalDetalle').classList.add('abierto');
    $('cuerpoDetalle').innerHTML = '<div class="cargando">Descargando detalles...</div>';
    
    try {
        const [ resDet, resDefs, resEvis, resUsuarios ] = await Promise.all([
            supabase.from('auditorias').select('*, auditoria_proveedores(nombre)').eq('id', id).single(),
            supabase.from('auditoria_defectos').select('*').eq('auditoria_id', id),
            supabase.from('auditoria_evidencias').select('*').eq('auditoria_id', id),
            supabase.from('auditoria_usuarios').select('id, nombre')
        ]);

        const det = resDet.data;
        const defs = resDefs.data;
        const evis = resEvis.data;
        const usuarios = resUsuarios.data;

        if (resDet.error || !det) { throw resDet.error; }

        let nombreAuditora = 'N/A';
        if (usuarios) {
            const auditora = usuarios.find(function(u) { return u.id === det.auditora_id; });
            if (auditora) { nombreAuditora = auditora.nombre; }
        }
        
        const lote = Number(det.cantidad_produccion) || 0;
        const auditadas = Number(det.cantidad_auditada) || 0;
        let tMenor = 0, tMayor = 0, tCritico = 0, tTotal = 0;
        
        if (defs) {
            defs.forEach(function(d) {
                const cant = Number(d.cantidad) || 0;
                tTotal += cant;
                if (d.severidad === 'menor') { tMenor += cant; }
                else if (d.severidad === 'mayor') { tMayor += cant; }
                else if (d.severidad === 'critico') { tCritico += cant; }
            });
        }
        
        const pctDefectos = auditadas > 0 ? ((tTotal / auditadas) * 100).toFixed(2) : 0;
        const pctMuestra = lote > 0 ? ((auditadas / lote) * 100).toFixed(2) : 0;

        let htmlDetalles = '<div class="detalle-grid">' +
            '<div class="detalle-item"><b>Referencia / SKU</b>' + (det.referencia || 'N/A') + ' <small>(' + (det.sku || 'N/A') + ')</small></div>' +
            '<div class="detalle-item"><b>Proveedor</b>' + (det.auditoria_proveedores ? det.auditoria_proveedores.nombre : 'N/A') + '</div>' +
            '<div class="detalle-item"><b>Fecha de Revisión</b>' + (det.fecha_auditoria || 'N/A') + '</div>' +
            '<div class="detalle-item"><b>Auditora</b>' + nombreAuditora + '</div>' +
            '<div class="detalle-item"><b>Producción (Lote)</b>' + lote + ' unidades</div>' +
            '<div class="detalle-item"><b>Unidades Auditadas</b>' + auditadas + ' unidades</div>' +
            '<div class="detalle-item"><b>% Índice de Defectos</b>' + pctDefectos + '%</div>' +
            '<div class="detalle-item"><b>% Tamaño de Muestra</b>' + pctMuestra + '%</div>' +
            '<div class="detalle-item"><b>Resultado Final</b><span class="estado-' + (det.resultado || '') + '">' + (det.resultado ? det.resultado.toUpperCase() : 'N/A') + '</span></div>' +
            '<div class="detalle-item"><b>N° Factura</b>' + (det.numero_factura || 'N/A') + '</div>' +
        '</div>';

        htmlDetalles += '<div class="seccion-detalle"><h4>Defectos Registrados (' + (defs ? defs.length : 0) + ' tipos)</h4>';
        if (defs && defs.length > 0) {
            htmlDetalles += '<table style="margin-bottom: 16px;"><thead><tr><th>Severidad</th><th>Defecto</th><th>Color / Talla</th><th class="num">Cant.</th></tr></thead><tbody>';
            defs.forEach(function(d) {
                htmlDetalles += '<tr>' +
                    '<td><span class="pastilla" style="background:#f0f0f0; padding:2px 6px; border-radius:4px; font-size:11px;">' + d.severidad + '</span></td>' +
                    '<td>' + d.defecto + '</td>' +
                    '<td>' + (d.color || '-') + ' / ' + (d.talla || '-') + '</td>' +
                    '<td class="num">' + d.cantidad + '</td>' +
                '</tr>';
            });
            htmlDetalles += '</tbody></table>';
        } else {
            htmlDetalles += '<p style="font-size:13px; color:#8A8279; margin:0 0 16px 0;">No se registraron defectos en esta auditoría.</p>';
        }
        htmlDetalles += '</div>';

        htmlDetalles += '<div class="seccion-detalle"><h4>Resumen de Defectos</h4>' +
            '<div class="resumen-defectos">' +
                '<div class="caja-resumen menor"><b>' + tMenor + '</b><span>Menores</span></div>' +
                '<div class="caja-resumen mayor"><b>' + tMayor + '</b><span>Mayores</span></div>' +
                '<div class="caja-resumen critico"><b>' + tCritico + '</b><span>Críticos</span></div>' +
                '<div class="caja-resumen total"><b>' + tTotal + '</b><span>Total</span></div>' +
            '</div></div>';

        let obs = det.observaciones ? det.observaciones.replace(/\n/g, '<br>') : '<i style="color:#8A8279">Sin observaciones.</i>';
        htmlDetalles += '<div class="seccion-detalle"><h4>Observaciones Generales</h4><p style="font-size: 14px; margin: 0; line-height: 1.5;">' + obs + '</p></div>';

        htmlDetalles += '<div class="seccion-detalle"><h4>Evidencias Fotográficas (' + (evis ? evis.length : 0) + ')</h4>';
        if (evis && evis.length > 0) {
            htmlDetalles += '<div class="foto-grid">';
            evis.forEach(function(e) {
                htmlDetalles += '<div class="foto-card">' +
                    '<a href="' + e.url + '" target="_blank" title="Clic para ampliar"><img src="' + e.url + '"></a>' +
                    '<p>' + (e.observacion || 'Sin nota adjunta') + '</p>' +
                '</div>';
            });
            htmlDetalles += '</div>';
        } else {
            htmlDetalles += '<p style="font-size:13px; color:#8A8279; margin:0;">No se adjuntaron fotografías.</p>';
        }
        htmlDetalles += '</div>';

        $('cuerpoDetalle').innerHTML = htmlDetalles;
    } catch (err) {
        let errMsg = err ? err.message : '';
        $('cuerpoDetalle').innerHTML = '<div class="cargando" style="color:#8C2026;">No se pudo cargar la información.<br><small>' + errMsg + '</small></div>';
    }
};

const cerrarModal = function() { $('modalDetalle').classList.remove('abierto'); };
$('btnCerrarDetalle').addEventListener('click', cerrarModal);
$('modalDetalle').addEventListener('click', function(e) { if (e.target === $('modalDetalle')) { cerrarModal(); } });

$('filtroProv').addEventListener('change', renderData);
$('filtroRef').addEventListener('change', renderData);
$('filtroAuditor').addEventListener('change', renderData);

init();
</script>
</body>
</html>
