<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.8)), url('fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px;
            box-sizing: border-box;
            position: relative;
        }

        .btn-logout {
            position: absolute;
            top: 20px;
            right: 30px;
            background-color: rgba(220, 53, 69, 0.8);
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn-logout:hover {
            background-color: #dc3545;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.4);
        }

        .titulo { margin-bottom: 30px; text-align: center; margin-top: 20px; }
        .titulo h2 { margin: 5px 0; font-size: 28px; letter-spacing: 1px; }
        .titulo p { color: #ccc; margin: 0; }

        .contenedor-categorias {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 900px;
        }

        .categoria {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .categoria-titulo {
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .grid-botones {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            width: 100%;
        }
        
        .tarjeta-menu {
            background-color: rgba(30, 30, 30, 0.75); 
            backdrop-filter: blur(8px); 
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 240px;
        }

        .tarjeta-menu:hover { 
            border-color: #0078D4; 
            transform: translateY(-5px); 
            background-color: rgba(45, 45, 45, 0.9); 
            box-shadow: 0 15px 25px rgba(0, 120, 212, 0.3);
        }
        
        .icono { font-size: 45px; margin-bottom: 15px; }
        .texto { font-size: 16px; font-weight: bold; line-height: 1.3;}
    </style>
</head>
<body>

    <button id="btnCerrarSesion" class="btn-logout">🚪 Cerrar Sesión</button>

    <div class="titulo">
        <img src="logo.png" alt="Logo" style="width: 140px; margin-bottom: 10px;">
        <h2>Panel de Control</h2>
        <p>¿Qué deseas hacer hoy?</p>
    </div>

    <div class="contenedor-categorias">
        
        <!-- CATEGORÍA 1: INVENTARIO DE MUESTRAS -->
        <div class="categoria">
            <h3 class="categoria-titulo">📦 Inventario de Muestras</h3>
            <div class="grid-botones">
                <a href="formulario.html" class="tarjeta-menu">
                    <div class="icono">➕</div>
                    <div class="texto">Ingresar Nueva<br>Prenda</div>
                </a>

                <a href="dashboard.html" class="tarjeta-menu">
                    <div class="icono">📦</div>
                    <div class="texto">Ver / Modificar<br>Inventario</div>
                </a>

                <a href="reportes.html" class="tarjeta-menu">
                    <div class="icono">📊</div>
                    <div class="texto">Indicadores y<br>Reportes</div>
                </a>
            </div>
        </div>

        <!-- CATEGORÍA 2: WIPS DE DISEÑO -->
        <div class="categoria">
            <h3 class="categoria-titulo">🎨 Gestión y Seguimiento</h3>
            <div class="grid-botones">
                <a href="seguimiento_diseno.html" class="tarjeta-menu">
                    <div class="icono">🎨</div>
                    <div class="texto">WIPS de<br>Diseño</div>
                </a>
            </div>
        </div>

    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://emljzsxypeqecevffmwr.supabase.co';
        const supabaseKey = 'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function verificarSesion() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html'; 
            }
        }
        
        verificarSesion();

        document.getElementById('btnCerrarSesion').addEventListener('click', async function(e) {
            e.preventDefault();
            const btn = this;
            btn.textContent = "Saliendo... ⏳";
            btn.disabled = true;

            const { error } = await supabase.auth.signOut();
            
            if (error) {
                alert("Error al cerrar sesión: " + error.message);
                btn.textContent = "🚪 Cerrar Sesión";
                btn.disabled = false;
            } else {
                window.location.href = 'index.html'; 
            }
        });
    </script>
</body>
</html>
