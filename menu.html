<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal - Reign</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-image: linear-gradient(rgba(10, 10, 10, 0.7), rgba(0, 0, 0, 0.9)), url('fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden; /* Previene scroll horizontal */
        }

        /* --- BARRA SUPERIOR --- */
        .top-navbar {
            display: flex;
            justify-content: flex-end;
            padding: 15px 30px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-logout {
            background-color: rgba(220, 53, 69, 0.15);
            color: #ff6b6b;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            border: 1px solid rgba(220, 53, 69, 0.3);
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-logout:hover {
            background-color: rgba(220, 53, 69, 0.9);
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
            border-color: transparent;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 0 20px 40px 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- ENCABEZADO --- */
        .titulo { 
            text-align: center; 
            margin-bottom: 35px;
            animation: fadeInDown 0.8s ease-out;
        }
        
        .titulo img {
            width: 110px;
            margin-bottom: 5px;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.5));
        }

        .titulo h2 { 
            margin: 0; 
            font-size: 26px; 
            font-weight: 700;
            letter-spacing: 2px; 
            text-transform: uppercase;
        }

        .titulo p { 
            color: #a0a0a0; 
            margin: 5px 0 0 0; 
            font-size: 14px;
            font-weight: 400;
        }

        /* --- CUADRÍCULA DE MÓDULOS --- */
        .contenedor-categorias {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px; /* Espacio entre los diferentes módulos */
            width: 100%;
        }

        /* --- CATEGORÍA INDIVIDUAL --- */
        .categoria {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 260px;
            flex-grow: 1;
            max-width: 350px;
            animation: fadeIn 1s ease-out backwards;
        }

        /* Animación en cascada para las categorías */
        .categoria:nth-child(1) { animation-delay: 0.1s; }
        .categoria:nth-child(2) { animation-delay: 0.2s; }
        .categoria:nth-child(3) { animation-delay: 0.3s; }

        .categoria-titulo {
            width: 100%;
            text-align: center;
            color: #d1d1d1;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .categoria-titulo::before,
        .categoria-titulo::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.2), rgba(255,255,255,0));
        }

        .grid-botones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
        }
        
        /* --- TARJETAS DE BOTONES --- */
        .tarjeta-menu {
            background-color: rgba(40, 40, 40, 0.5); 
            padding: 18px 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-decoration: none;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
        }

        .tarjeta-menu:hover { 
            border-color: #0078D4; 
            transform: translateY(-4px); 
            background-color: rgba(60, 60, 60, 0.8); 
            box-shadow: 0 8px 20px rgba(0, 120, 212, 0.25);
            color: #ffffff;
        }
        
        .icono { 
            font-size: 28px; 
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }

        .tarjeta-menu:hover .icono {
            transform: scale(1.15);
        }

        .texto { 
            font-size: 13px; 
            font-weight: 600; 
            line-height: 1.3;
        }

        /* --- ANIMACIONES --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

    </style>
    <!-- Guardián de sesión: cierra al cambiar el día o tras 4 horas sin uso -->
    <script type="module" src="sesion.js"></script>
</head>
<body>

    <div class="top-navbar">
        <button id="btnCerrarSesion" class="btn-logout">🚪 Cerrar Sesión</button>
    </div>

    <div class="main-wrapper">
        <div class="titulo">
            <img src="logo.png" alt="Logo">
            <h2>Panel de Control</h2>
            <p>¿Qué deseas hacer hoy?</p>
        </div>

        <div class="contenedor-categorias">
            
            <!-- CATEGORÍA 1: INVENTARIO DE MUESTRAS -->
            <div class="categoria">
                <h3 class="categoria-titulo">📦 Inventario</h3>
                <div class="grid-botones">
                    <a href="formulario.html" class="tarjeta-menu">
                        <div class="icono">➕</div>
                        <div class="texto">Ingresar Nueva<br>Prenda</div>
                    </a>

                    <a href="dashboard.html" class="tarjeta-menu">
                        <div class="icono">📦</div>
                        <div class="texto">Ver / Modificar<br>Inventario</div>
                    </a>

                    <a href="reportes.html" class="tarjeta-menu" style="grid-column: 1 / -1;">
                        <div class="icono">📊</div>
                        <div class="texto">Indicadores y Reportes</div>
                    </a>
                </div>
            </div>

            <!-- CATEGORÍA 2: WIPS DE DISEÑO -->
            <div class="categoria">
                <h3 class="categoria-titulo">🎨 Diseño</h3>
                <div class="grid-botones">
                    <a href="seguimiento_diseno.html" class="tarjeta-menu" style="grid-column: 1 / -1; padding: 25px 12px;">
                        <div class="icono" style="font-size: 34px;">🎨</div>
                        <div class="texto">WIPS de Diseño<br><span style="font-size: 11px; font-weight: normal; color: #aaa; margin-top: 4px; display: block;">Gestión y Seguimiento</span></div>
                    </a>
                </div>
            </div>

            <!-- CATEGORÍA 3: PRODUCCIÓN -->
            <div class="categoria">
                <h3 class="categoria-titulo">🏭 Producción</h3>
                <div class="grid-botones">
                    <a href="produccion.html" class="tarjeta-menu" style="grid-column: 1 / -1; padding: 25px 12px;">
                        <div class="icono" style="font-size: 34px;">📈</div>
                        <div class="texto">Tablero de Producción<br><span style="font-size: 11px; font-weight: normal; color: #aaa; margin-top: 4px; display: block;">Control y Análisis</span></div>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://emljzsxypeqecevffmwr.supabase.co';
        const supabaseKey = 'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function verificarSesion() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html'; 
            }
        }
        
        verificarSesion();

        document.getElementById('btnCerrarSesion').addEventListener('click', async function(e) {
            e.preventDefault();
            const btn = this;
            btn.textContent = "Saliendo... ⏳";
            btn.disabled = true;

            const { error } = await supabase.auth.signOut();
            
            if (error) {
                alert("Error al cerrar sesión: " + error.message);
                btn.textContent = "🚪 Cerrar Sesión";
                btn.disabled = false;
            } else {
                window.location.href = 'index.html'; 
            }
        });
    </script>
</body>
</html>
