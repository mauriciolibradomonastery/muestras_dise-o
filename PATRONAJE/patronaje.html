<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento Técnico y Patronaje</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root { --w-col-0: 60px; --w-col-1: 110px; --w-col-7: 150px; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 25px; 
            background-image: linear-gradient(rgba(245, 247, 250, 0.88), rgba(230, 235, 242, 0.92)), url('fondo.png');
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            color: #1f2937; min-height: 100vh;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(0, 0, 0, 0.1); padding-bottom: 15px; }
        .titulo-bodega { font-size: 16px; font-weight: 800; color: #111827; text-transform: uppercase; letter-spacing: 1px; }
        .btn-logout { background-color: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2); transition: 0.2s; }
        .btn-logout:hover { background-color: #dc2626; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; flex-wrap: wrap; }
        .acciones-izq, .acciones-der { display: flex; gap: 10px; align-items: center; }

        .btn { padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: #374151; background-color: #ffffff; border: 1px solid #d1d5db; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03); transition: all 0.2s; }
        .btn:hover { background-color: #f3f4f6; color: #111827; border-color: #9ca3af; }
        
        .btn-save { background-color: #10b981; color: white; border: none; font-weight: 700; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); } 
        .btn-save:hover { background-color: #059669; color: white; transform: translateY(-1px); }
        .btn-save.unsaved { background-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        .btn-save.unsaved:hover { background-color: #dc2626; }

        .btn-bulk-delete { background-color: #fff1f2; color: #b91c1c; border: 1px solid #fda4af; display: none; }
        .btn-bulk-delete:hover { background-color: #fecdd3; color: #9f1239; }

        .search-input { width: 320px; padding: 9px 16px; border-radius: 8px; border: 1px solid #d1d5db; background-color: #ffffff; color: #111827; outline: none; font-size: 13px; }
        .search-input:focus { border-color: #3b82f6; }

        /* TABLA ESTILO EXCEL CLARO CON ALTURA AMPLIADA */
        .table-container { width: 100%; overflow-x: auto; height: calc(100vh - 165px); max-height: calc(100vh - 165px); background: #ffffff; border-radius: 10px; border: 1px solid #d1d5db; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06); }
        table { border-collapse: collapse; width: max-content; }
        th, td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; position: relative; color: #374151; }
        thead { position: sticky; top: 0; z-index: 10; background-color: #f9fafb; }
        .th-title { cursor: pointer; user-select: none; color: #374151; font-weight: 600; font-size: 11px; text-transform: uppercase; background: #f3f4f6; padding: 10px; }
        .filter-input { width: 100%; padding: 4px 8px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 4px; background: #ffffff; color: #111827; box-sizing: border-box;}
        tbody tr:hover td { filter: brightness(0.96); }
        td[contenteditable="true"]:focus { background-color: #ffffff; box-shadow: inset 0 0 0 2px #374151; outline: none; color: #111827; z-index: 20;}

        /* CONGELACIÓN DE COLUMNAS */
        .col-checkbox { position: sticky !important; left: 0; background-color: inherit; z-index: 8; border-right: 1px solid #d1d5db !important; text-align: center; }
        th.col-checkbox { z-index: 19 !important; background-color: #f3f4f6 !important; }

        .col-precinto { position: sticky !important; left: var(--left-precinto, 60px); z-index: 8; background-color: inherit; border-right: 1px solid #e5e7eb; }
        .col-nombre { position: sticky !important; left: var(--left-nombre, 160px); z-index: 8; background-color: inherit; border-right: 1px solid #e5e7eb; }
        .col-pinta { position: sticky !important; left: var(--left-pinta, 260px); z-index: 8; background-color: inherit; border-right: 1px solid #e5e7eb; }
        .col-desc { position: sticky !important; left: var(--left-desc, 360px); z-index: 8; background-color: inherit; border-right: 2px solid #9ca3af !important; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }

        th.col-precinto, th.col-nombre, th.col-pinta, th.col-desc { z-index: 19 !important; background-color: #f3f4f6 !important; color: #374151; }

        .resizer { position: absolute; top: 0; right: 0; width: 6px; cursor: col-resize; user-select: none; height: 100%; z-index: 25; }
        .resizer:hover, .resizer.resizing { background-color: #3b82f6; }

        .calc-cell { font-weight: bold; text-align: center; }
        .estado-cell { font-weight: bold; text-align: center; color: #2563eb; }

        /* MODALES */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background-color: #ffffff; padding: 30px; border-radius: 12px; width: 500px; color: #1f2937; border: 1px solid #e5e7eb; box-shadow: 0 10px 40px rgba(0,0,0,0.2);}
        #modalVisor { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; cursor: zoom-out; }
        #imagenAmpliada { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.8); object-fit: contain; }
    </style>
</head>
<body>

    <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column; backdrop-filter: blur(5px);">

                <tr id="tableHeaderRow"></tr>

            <tbody id="tableBody"></tbody>

    <div id="modal-agregar" class="modal">
        <div class="modal-content">
            <h3 style="color: #2563eb; margin-top: 0; font-size: 20px;">➕ Importar Prendas a Patronaje</h3>
            <label style="color:#6b7280; font-size: 13px;">Escribe o pega los Precintos (separados por coma, espacios o saltos de línea):</label>
            <div style="display:flex; flex-direction:column; gap: 10px; margin-top: 10px;">
                <textarea id="inputBuscarPrecinto" placeholder="Ej:&#10;MST-10293&#10;MST-10294&#10;MST-10295" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; background: #ffffff; color: #111827; outline: none; resize: vertical; min-height: 80px; font-family: inherit; font-size: 13px;"></textarea>

    </div>

    <div id="modalVisor" onclick="cerrarModal('modalVisor')"><img id="imagenAmpliada"></div>

    <script>
        const URL_PROYECTO = 'https://emljzsxypeqecevffmwr.supabase.co'; 
        const KEY_PROYECTO = 'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W';
        const client = window.supabase.createClient(URL_PROYECTO, KEY_PROYECTO, { auth: { storage: window.localStorage } });
        
        // --- COLUMNAS ACTUALIZADAS AL 10 DE AGOSTO DE 2026 ---
        const allCols = [
            'FOTO', 'FECHA DE INGRESO:', 'ESTADO', 'PROVEEDOR:', 'DISEÑADOR:', 'COLECCIÓN:', 'GÉNERO', 'PRECINTO',
            'NOMBRE / REFERENCIA:', 'TALLA', 'TIPO DE MUESTRA:', 'PINTA:', 'CANTIDAD:', 'DESCRIPCIÓN TIPO DE PRENDA:',
            'MEDICIÓN:', 'INGRESO HÚMEDO', 'SALIDA HÚMEDO', 'FECHA ENTREGA (AUDITORÍA)', 'AUDITOR:', 
            'LEAD TIME AUD', 'RESULTADO', 'MOTIVO 1', 'MOTIVO 2', 'MOTIVO 3', 'FECHA FINAL',
            'LEAD TIME ENTREGA', 'LEAD TIME GENERAL', 'TIPO', 'PDF AUDITORÍA'
        ];

        const listaMotivos = [
            "", "% ENCOGIMIENTO", "ARTES", "ASIMETRIA", "ASPECTO", "BORDADO", "CALIDAD", "CAMBIO DE SILUETA",
            "CAMBIO EN DISEÑO", "CASES", "COLOR", "CONFECCION", "CREMALLERA", "CREMALLERA ONDULADA", "CUELLO ONDULADO",
            "DECOLORACIÓN", "DESCOSIDOS", "DESPEGADO", "DESPISTE", "DISEÑO", "ELÁSTICO", "ESTAMPADO", "ETIQUETA",
            "FIBRAS EXPUESTAS", "HILOS", "HORMA", "INCOMODO", "INSUMOS", "LASER", "LOOK", "MARQUILLA", "MARRAS",
            "MEDIDAS", "MOLDERÍA", "PEGANTE EXPUESTO", "PELADO", "PIEZA TEJIDA", "PIEZA VIRADA", "PILLING", "PLANCHA",
            "POROS", "PROCESO LAVADO", "RANURAS DEFORMADAS", "RASPADO", "ROTOS", "TALLONES", "TEJIDO FRIZADO", "TELA",
            "TRANSFERENCIA COLOR", "TRASLUCE EL FORRO", "VACIOS"
        ];

        const mapeoTipo = {
            "ORIGINAL": "DESARROLLO", "PHOTO SAMPLE": "PRODUCCION", "PP SAMPLE": "DESARROLLO", "PROTO": "DESARROLLO",
            "SIZE SET PP SAMPLE": "DESARROLLO", "SIZE SET PHOTO SAMPLE": "PRODUCCION", "2DA PHOTO SAMPLE": "PRODUCCION",
            "3RA PHOTO SAMPLE": "PRODUCCION", "4TA PHOTO SAMPLE": "PRODUCCION", "SHIPPING SAMPLE": "PRODUCCION",
            "2DA PP SAMPLE": "DESARROLLO", "2DO SIZE SET PP SAMPLE": "DESARROLLO", "3RA PP SAMPLE": "DESARROLLO",
            "4TA PP SAMPLE": "DESARROLLO", "5TA PP SAMPLE": "DESARROLLO", "2 PP SAMPLE": "DESARROLLO",
            "MUESTRA ORIGINAL": "DESARROLLO", "SIZE SET PROTO": "DESARROLLO"
        };

        let hayCambiosSinGuardar = false;
        window.marcarCambios = function() {
            hayCambiosSinGuardar = true;
            const btn = document.getElementById('btnGuardarGlobal');
            btn.classList.add('unsaved');
            btn.innerText = '⚠️ Guardar Cambios';
        };
        window.resetearCambios = function() {
            hayCambiosSinGuardar = false;
            const btn = document.getElementById('btnGuardarGlobal');
            btn.classList.remove('unsaved');
            btn.innerText = '💾 Guardar Cambios';
        };

        let timerBusqueda = null;
        window.ejecutarFiltro = function() {
            clearTimeout(timerBusqueda);
            timerBusqueda = setTimeout(() => { window.filtrarTablaCompleta(); }, 350); 
        };

        async function verificarSesion() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) window.location.href = "index_patronaje.html";
        }
        window.cerrarSesion = async function() { await client.auth.signOut(); window.location.href = "index_patronaje.html"; }
        verificarSesion();

        window.cambiarFotoFila = function(input) {
            if(input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    const img = input.closest('td').querySelector('.img-foto-prenda');
                    img.src = e.target.result;
                    recalcularFila(input.closest('tr')); 
                    marcarCambios();
                }; reader.readAsDataURL(input.files[0]);
            }
        };

        window.subirPdfFila = function(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                if(file.size > 2.5 * 1024 * 1024) { return alert("El PDF es muy pesado. Sube un archivo menor a 2.5MB."); }
                let reader = new FileReader();
                reader.onload = function(e) {
                    const td = input.closest('td'); const base64 = e.target.result;
                    td.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px; justify-content:center;">
                            <a href="${base64}" download="Auditoria.pdf" style="color:#ef4444; font-weight:bold; font-size:12px; text-decoration:none;">📄 Ver PDF</a>
                            <button onclick="eliminarPdf(this)" style="background:transparent; border:none; cursor:pointer;" title="Quitar">❌</button>
                            <input type="hidden" value="${base64}" class="pdf-data">
                        </div>`;
                    recalcularFila(td.closest('tr'));
                    marcarCambios();
                }; reader.readAsDataURL(file);
            }
        };

        window.eliminarPdf = function(btn) {
            const td = btn.closest('td');
            td.innerHTML = `
                <button onclick="this.nextElementSibling.click()" class="btn" style="padding: 4px 8px; font-size:11px;">📎 Subir PDF</button>
                <input type="file" accept=".pdf" style="display:none;" onchange="subirPdfFila(this)">
                <input type="hidden" value="" class="pdf-data">
            `;
            recalcularFila(td.closest('tr'));
            marcarCambios();
        };

        function calcularDiasHabiles(fechaInicioStr, fechaFinStr) {
            if (!fechaInicioStr || !fechaFinStr) return "";
            let start = new Date(fechaInicioStr); let end = new Date(fechaFinStr);
            if (isNaN(start) || isNaN(end) || start > end) return "";
            let count = 0; let current = new Date(start);
            while (current <= end) {
                let dayOfWeek = current.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { count++; }
                current.setDate(current.getDate() + 1);
            } return count.toString();
        }

        window.recalcularFila = function(tr) {
            const celdas = tr.querySelectorAll('td');
            
            // Los índices corresponden a posición + 1 por el checkbox
            const fMedicion = celdas[15].querySelector('input') ? celdas[15].querySelector('input').value : celdas[15].innerText.trim();
            const fEntAud = celdas[18].querySelector('input') ? celdas[18].querySelector('input').value : celdas[18].innerText.trim();
            const res = celdas[21].querySelector('select') ? celdas[21].querySelector('select').value : celdas[21].innerText.trim();
            const fEntFich = celdas[25].querySelector('input') ? celdas[25].querySelector('input').value : celdas[25].innerText.trim();
            const tipoMuestra = celdas[11].innerText.trim().toUpperCase();

            // ESTADO
            let estadoCalculado = "Pendiente";
            if (fMedicion !== "") estadoCalculado = "Modelado";
            if (fEntAud !== "") estadoCalculado = "Asignado";
            if (fEntFich !== "") estadoCalculado = "Finalizado";
            celdas[3].textContent = estadoCalculado;

            // COLOR AUTOMÁTICO
            let bgColor = '#ffffff'; 
            if (estadoCalculado === 'Pendiente') bgColor = '#ef4444'; // Rojo fuerte
            else if (estadoCalculado === 'Modelado' || estadoCalculado === 'Asignado') bgColor = '#fef3c7'; // Amarillo claro
            else if (estadoCalculado === 'Finalizado') bgColor = '#4ade80'; // Verde oscuro

            tr.style.backgroundColor = bgColor;
            celdas.forEach(td => td.style.backgroundColor = bgColor);

            // LEAD TIMES (Calculados desde MEDICIÓN)
            celdas[20].textContent = (fMedicion && fEntAud) ? calcularDiasHabiles(fMedicion, fEntAud) : ""; 
            celdas[27].textContent = celdas[20].textContent; 

            if (fEntFich === "") { celdas[26].textContent = ""; }  
            else if (res === "CANCELADO" || res === "OBSEQUIO") { celdas[26].textContent = "0"; } 
            else if (fMedicion && fEntFich) { celdas[26].textContent = calcularDiasHabiles(fMedicion, fEntFich); } 
            else { celdas[26].textContent = ""; }

            let tipoCalculado = mapeoTipo[tipoMuestra] || "";
            if(tipoCalculado === "") { for (const key in mapeoTipo) { if (tipoMuestra.includes(key)) { tipoCalculado = mapeoTipo[key]; break; } } }
            celdas[28].textContent = tipoCalculado; 

            // Caché interna
            tr._datosOriginal = [];
            tr._datosLower = [];

            for(let i = 1; i <= 29; i++) {
                if(!celdas[i]) continue;
                let val = "";
                if (i === 1) val = ""; 
                else if (i === 29) {
                    const pdfInput = celdas[i].querySelector('.pdf-data');
                    val = pdfInput ? pdfInput.value : "";
                }
                else if (celdas[i].querySelector('select')) val = celdas[i].querySelector('select').value;
                else if (celdas[i].querySelector('input[type="date"]')) val = celdas[i].querySelector('input[type="date"]').value;
                else val = celdas[i].innerText.trim();
                
                tr._datosOriginal[i] = val;
                tr._datosLower[i] = val.toLowerCase();
            }
            tr._textoGlobal = tr._datosLower.join(" ");
        };

        window.actualizarSticky = function() {
            const trHeader = document.getElementById('tableHeaderRow');
            if(!trHeader) return;
            const ths = trHeader.querySelectorAll('th');
            if(ths.length < 10) return;
            
            let leftPos = ths[0].offsetWidth; 
            
            document.documentElement.style.setProperty('--left-precinto', `${leftPos}px`);
            leftPos += ths[7].offsetWidth; 
            
            document.documentElement.style.setProperty('--left-nombre', `${leftPos}px`);
            leftPos += ths[8].offsetWidth; 
            
            document.documentElement.style.setProperty('--left-pinta', `${leftPos}px`);
            leftPos += ths[11].offsetWidth; 
            
            document.documentElement.style.setProperty('--left-desc', `${leftPos}px`);
        };

        window.addEventListener('resize', window.actualizarSticky);

        function inicializarEncabezados() {
            const trHeader = document.getElementById('tableHeaderRow'); const trFilter = document.getElementById('tableFilterRow');
            const thCheck = document.createElement('th'); thCheck.className = 'col-checkbox'; thCheck.innerHTML = `<input type="checkbox" id="selectAll" onclick="toggleSelectAll()">`;
            trHeader.appendChild(thCheck); trFilter.appendChild(document.createElement('th')).className = 'col-checkbox';

            allCols.forEach((col, idx) => { 
                const thTitle = document.createElement('th'); thTitle.className = 'th-title'; thTitle.innerHTML = `${col} ↕`; thTitle.onclick = () => ordenarTabla(idx + 1);
                
                if (col === 'PRECINTO') thTitle.classList.add('col-precinto');
                if (col === 'NOMBRE / REFERENCIA:') thTitle.classList.add('col-nombre');
                if (col === 'PINTA:') thTitle.classList.add('col-pinta');
                if (col === 'DESCRIPCIÓN TIPO DE PRENDA:') thTitle.classList.add('col-desc');

                trHeader.appendChild(thTitle);
                
                let resizer = document.createElement('div'); resizer.className = 'resizer'; thTitle.appendChild(resizer);
                let x = 0; let w = 0;
                resizer.addEventListener('mousedown', function(e) {
                    x = e.clientX; w = parseInt(window.getComputedStyle(thTitle).width, 10);
                    const mouseMoveHandler = (ev) => { 
                        document.documentElement.style.setProperty(`--w-col-${idx + 1}`, `${Math.max(40, w + ev.clientX - x)}px`); 
                        window.actualizarSticky();
                    };

        async function cargarDatos() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').innerText = "Conectando con la base de datos...";
            
            let allData = [];
            let from = 0;
            const step = 1000;
            let fetching = true;

            while (fetching) {
                document.getElementById('loadingText').innerText = `Descargando registros: ${allData.length}...`;
                
                const { data, error } = await client.from('dpto_tecnico')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .range(from, from + step - 1);
                    
                if (error) { 
                    console.error(error); document.getElementById('loadingOverlay').style.display = 'none'; return alert("Hubo un error descargando la información."); 
                }
                
                if (data && data.length > 0) { allData = allData.concat(data); from += step; } else { fetching = false; }
                if (data.length < step) { fetching = false; }
            }

            const tbody = document.getElementById('tableBody'); tbody.innerHTML = ''; 
            if(!allData || allData.length === 0) { document.getElementById('loadingOverlay').style.display = 'none'; return; }

            // ORDENAMIENTO POR SEMÁFORO (ROJO -> AMARILLO -> VERDE) y LUEGO POR FECHA
            allData.sort((a, b) => {
                const getEstadoRank = (datos) => {
                    const fMedicion = datos[14] || '';
                    const fEntAud = datos[17] || '';
                    const fEntFich = datos[24] || '';
                    
                    let estado = "Pendiente";
                    if (fMedicion !== "") estado = "Modelado";
                    if (fEntAud !== "") estado = "Asignado";
                    if (fEntFich !== "") estado = "Finalizado";
                    
                    if (estado === 'Pendiente') return 1;
                    if (estado === 'Modelado' || estado === 'Asignado') return 2;
                    return 3;
                };

                const rankA = getEstadoRank(a.datos);
                const rankB = getEstadoRank(b.datos);
                
                if (rankA !== rankB) return rankA - rankB; 
                
                const dateA = new Date(a.datos[1] || '1970-01-01').getTime();
                const dateB = new Date(b.datos[1] || '1970-01-01').getTime();
                return dateB - dateA; 
            });

            let i = 0; const chunkSize = 150; 
            
            function renderChunk() {
                const fragment = document.createDocumentFragment();
                const end = Math.min(i + chunkSize, allData.length);
                for (; i < end; i++) {
                    let d = allData[i].datos || []; 
                    fragment.appendChild(crearFilaHTML(allData[i].id, d));
                }
                tbody.appendChild(fragment);
                
                if (i < allData.length) {
                    document.getElementById('loadingText').innerText = `Dibujando muestras: ${i} de ${allData.length}...`;
                    requestAnimationFrame(renderChunk);
                } else {
                    document.getElementById('loadingText').innerText = "Optimizando filtros...";
                    setTimeout(() => {
                        window.actualizarDatalists(); window.actualizarSticky(); window.ejecutarFiltro();
                        document.getElementById('loadingOverlay').style.display = 'none';
                    }, 100);
                }
            }
            renderChunk();
        }

            return html;
        }

        window.extraerDatosFila = function(tr) {
            const celdas = tr.querySelectorAll('td'); 
            let datosFila = new Array(29).fill("");
            
            for(let i = 1; i <= 29; i++) { 
                const td = celdas[i];
                if (!td) continue;

                if (i === 1) { 
                    const img = td.querySelector('.img-foto-prenda'); datosFila[i-1] = (img && !img.src.includes('logo.png')) ? img.src : "";
                } else if (i === 29) {
                    const pdfInput = td.querySelector('.pdf-data'); datosFila[i-1] = pdfInput ? pdfInput.value : "";
                } else if (td.querySelector('select')) { 
                    datosFila[i-1] = td.querySelector('select').value;
                } else if (td.querySelector('input[type="date"]')) { 
                    datosFila[i-1] = td.querySelector('input[type="date"]').value;
                } else { 
                    datosFila[i-1] = td.innerText.trim();
                }
            } return datosFila;
        };

        window.guardarCambiosVisibles = async function() {
            if(!hayCambiosSinGuardar && document.getElementById('btnGuardarGlobal').innerText.includes('💾')) return;

            const btn = document.getElementById('btnGuardarGlobal'); const textoOriginal = btn.innerHTML;
            btn.innerHTML = "⏳ Guardando..."; btn.disabled = true; btn.classList.remove('unsaved');
            
            const filas = document.getElementById('tableBody').querySelectorAll('tr'); 
            let registrosActualizar = [];
            let registrosNuevos = [];

            for (let tr of filas) {
                if (tr.style.display === 'none') continue; 
                let datosFila = window.extraerDatosFila(tr);
                
                if (tr.dataset.id) { 
                    registrosActualizar.push({ id: tr.dataset.id, datos: datosFila, precinto: datosFila[7] }); 
                } else {
                    registrosNuevos.push({ datos: datosFila, precinto: datosFila[7] }); 
                }
            }

            try {
                if(registrosActualizar.length > 0) {
                    const chunkSize = 150;
                    for (let i = 0; i < registrosActualizar.length; i += chunkSize) {
                        const chunk = registrosActualizar.slice(i, i + chunkSize);
                        const { error } = await client.from('dpto_tecnico').upsert(chunk);
                        if (error) throw error;
                    }
                }
                
                if(registrosNuevos.length > 0) {
                    const { data: inserted, error } = await client.from('dpto_tecnico').insert(registrosNuevos).select();
                    if (error) throw error;
                    let newRowsIndex = 0;
                    for (let tr of filas) {
                        if (tr.style.display !== 'none' && !tr.dataset.id && inserted[newRowsIndex]) {
                            tr.dataset.id = inserted[newRowsIndex].id;
                            newRowsIndex++;
                        }
                    }
                }
                
                btn.innerHTML = "✅ ¡Todo guardado!"; 
                resetearCambios();
                actualizarDatalists(); 
            } catch (err) { 
                console.error(err); alert("Hubo un error al guardar: " + err.message); btn.innerHTML = "❌ Error"; btn.classList.add('unsaved');

        window.procesarExcelImportado = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: true });

                    if (jsonRows.length <= 1) return alert("El archivo está vacío o solo tiene encabezados.");

                    const rowsData = jsonRows.slice(1);
                    let registrosInsert = [];
                    
                    const columnasFechas = [1, 14, 15, 16, 17, 24]; // Índices exactos de fecha

                    function convertirFechaExcel(val) {
                        if (!val) return "";
                        let num = Number(val);
                        if (!isNaN(num) && num > 20000) {
                            let date = new Date(Math.round((num - 25569) * 86400 * 1000));
                            date = new Date(date.getTime() + date.getTimezoneOffset() * 60000);
                            return date.toISOString().split('T')[0];
                        }
                        if (typeof val === 'string' && val.includes('/')) {
                            let p = val.split('/');
                            if(p.length === 3 && p[2].length === 4) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                        }
                        if (typeof val === 'string' && val.includes('-')) return val.substring(0,10);
                        return String(val);
                    }

                    rowsData.forEach(row => {
                        let d = new Array(29).fill('');
                        for (let i = 0; i < 29; i++) {
                            let val = row[i] !== undefined && row[i] !== null ? row[i] : '';
                            if (columnasFechas.includes(i)) { d[i] = convertirFechaExcel(val); } else { d[i] = String(val); }
                        }
                        
                        const precinto = d[7] ? d[7].trim() : '';
                        if (precinto !== '') {
                            if (d[0].includes("Imagen Cargada")) d[0] = "";
                            if (d[28].includes("PDF Cargado")) d[28] = "";
                            registrosInsert.push({ precinto: precinto, datos: d });
                        }
                    });

                    if (registrosInsert.length === 0) return alert("No se encontraron filas con PRECINTO válido.");
                    alert(`⏳ Subiendo ${registrosInsert.length} muestras. Por favor no cierres la página ni presiones F5...`);
                    
                    const chunkSize = 200;
                    for (let i = 0; i < registrosInsert.length; i += chunkSize) {
                        const chunk = registrosInsert.slice(i, i + chunkSize);
                        const { error } = await client.from('dpto_tecnico').insert(chunk);
                        if (error) throw error;
                    }

                    alert("✅ ¡Carga masiva completada exitosamente!");
                    event.target.value = ""; 
                    cargarDatos(); 
                } catch (error) {
                    console.error(error); alert("Error al importar: " + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.filtrarTablaCompleta = function() {
            const textoGlobal = document.getElementById('inputBusquedaGlobal').value.toLowerCase();
            const inputsColumnas = Array.from(document.querySelectorAll('.col-filter')).map(inp => {
                let valRaw = inp.value.trim(); let valLower = valRaw.toLowerCase();
                let searchVal = valLower.replace(/\//g, '-'); let parts = searchVal.split('-');
                if (parts.length === 2 && parts[0].length <= 2 && parts[1].length === 4) { searchVal = `${parts[1]}-${parts[0].padStart(2, '0')}`; } 
                else if (parts.length === 3 && parts[0].length <= 2 && parts[2].length === 4) { searchVal = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`; }
                return { index: parseInt(inp.getAttribute('data-colindex')), val: searchVal, raw: valRaw };
            }).filter(inp => inp.val !== "");

            const filas = document.getElementById('tableBody').querySelectorAll('tr');
            let totalFilas = filas.length; let visibles = 0;

            filas.forEach(fila => {
                let mostrar = true;
                if (textoGlobal && !fila._textoGlobal.includes(textoGlobal)) { mostrar = false; } 
                else if (inputsColumnas.length > 0) {
                    for (let inp of inputsColumnas) {
                        let celdaTexto = fila._datosLower[inp.index] || "";
                        if (inp.raw.startsWith('"') && inp.raw.endsWith('"')) {
                            let exactTerm = inp.val.slice(1, -1).trim(); 
                            if (exactTerm !== celdaTexto) { mostrar = false; break; }
                        } else if (!celdaTexto.includes(inp.val)) { mostrar = false; break; }
                    }
                }
                
                if (mostrar) {
                    if (fila.style.display === 'none') fila.style.display = '';
                    visibles++;
                } else {
                    if (fila.style.display !== 'none') fila.style.display = 'none';
                    const cb = fila.querySelector('.row-checkbox'); if (cb && cb.checked) cb.checked = false;
                }
            });

            const elVisibles = document.getElementById('cantVisibles'); const elTotal = document.getElementById('cantTotal');
            if (elVisibles && elTotal) { elVisibles.innerText = visibles.toLocaleString(); elTotal.innerText = totalFilas.toLocaleString(); }
            window.actualizarSeleccion(); 
        };

            const hoy = new Date(); const fechaIngreso = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');

            window.prendasAImportar.forEach(prenda => {
                const precintoReal = prenda.precinto || prenda.id;
                let datosNuevos = new Array(29).fill(''); 
                datosNuevos[0] = prenda.fotoUrl || ''; datosNuevos[1] = fechaIngreso; datosNuevos[3] = prenda.proveedor || ''; 
                datosNuevos[5] = prenda.coleccion || ''; datosNuevos[6] = prenda.genero || ''; datosNuevos[7] = precintoReal;
                datosNuevos[8] = prenda.referencia || ''; datosNuevos[9] = prenda.talla || ''; datosNuevos[10] = prenda.clasificacion || '';
                datosNuevos[11] = prenda.color || ''; datosNuevos[12] = prenda.cantidad || ''; datosNuevos[13] = prenda.linea || '';
                
                registrosInsert.push({ precinto: precintoReal, datos: datosNuevos });
            });

            const { data: insertedData, error } = await client.from('dpto_tecnico').insert(registrosInsert).select();
            
            if(error) { 
                alert("Error al vincular: " + error.message); 
                btn.textContent = `➕ Confirmar y Agregar ${window.prendasAImportar.length} Filas`; btn.disabled = false;
            } else { 
                cerrarModal('modal-agregar'); 
                
                const tbody = document.getElementById('tableBody');
                const fragment = document.createDocumentFragment();
                let rowsToRender = insertedData || registrosInsert; 
                
                rowsToRender.forEach(row => { fragment.appendChild(crearFilaHTML(row.id, row.datos)); });
                tbody.insertBefore(fragment, tbody.firstChild);

                window.actualizarDatalists(); window.actualizarSticky(); window.ejecutarFiltro();
                marcarCambios();
            }
        }

        window.toggleSelectAll = function() {
            const isChecked = document.getElementById('selectAll').checked; const filas = document.getElementById('tableBody').querySelectorAll('tr');
            filas.forEach(tr => { if(tr.style.display !== 'none') { const cb = tr.querySelector('.row-checkbox'); if(cb) cb.checked = isChecked; } });
            window.actualizarSeleccion();
        };

        window.actualizarSeleccion = function() {
            const checkboxes = document.querySelectorAll('.row-checkbox:checked'); const bulkDiv = document.getElementById('bulkActions'); const countSpan = document.getElementById('selectedCount');
            let visiblesChecked = 0; checkboxes.forEach(cb => { if(cb.closest('tr').style.display !== 'none') visiblesChecked++; });
            if (visiblesChecked > 0) { bulkDiv.style.display = 'flex'; countSpan.textContent = visiblesChecked + " selec."; document.getElementById('btnEliminarMasivo').style.display = 'inline-block'; } 
            else { bulkDiv.style.display = 'none'; document.getElementById('btnEliminarMasivo').style.display = 'none'; }
        };

        window.eliminarSeleccionadas = async function() {
            const checkboxes = document.querySelectorAll('.row-checkbox:checked'); let idsToDelete = []; let rowsToRemove = [];
            checkboxes.forEach(cb => { const tr = cb.closest('tr'); if(tr.style.display !== 'none' && tr.dataset.id) { idsToDelete.push(tr.dataset.id); rowsToRemove.push(tr); } else if (!tr.dataset.id) { rowsToRemove.push(tr); } });
            if (rowsToRemove.length === 0) return;
            if (!confirm(`¿Estás seguro de eliminar definitivamente ${rowsToRemove.length} muestras de Patronaje?`)) return;
            
            if (idsToDelete.length > 0) { const { error } = await client.from('dpto_tecnico').delete().in('id', idsToDelete); if(error) { alert("Error al eliminar masivamente"); return; } }
            rowsToRemove.forEach(tr => tr.remove()); document.getElementById('selectAll').checked = false; window.actualizarSeleccion(); window.actualizarDatalists(); window.ejecutarFiltro();
            marcarCambios();
        };

        let columnaOrdenadaActual = -1; let ordenAscendente = true;
        window.ordenarTabla = function(colIndex) {
            const tbody = document.getElementById('tableBody'); const filas = Array.from(tbody.children); 
            if (filas.length === 0) return;
            
            document.getElementById('loadingOverlay').style.display = 'flex'; document.getElementById('loadingText').innerText = `Ordenando ${filas.length} registros...`;
            
            setTimeout(() => {
                if (columnaOrdenadaActual === colIndex) { ordenAscendente = !ordenAscendente; } else { ordenAscendente = true; columnaOrdenadaActual = colIndex; }
                
                filas.sort((a, b) => {
                    let valorA = a._datosOriginal ? a._datosOriginal[colIndex] : ""; let valorB = b._datosOriginal ? b._datosOriginal[colIndex] : "";
                    if (!valorA) valorA = ordenAscendente ? "zzzzzzz" : ""; if (!valorB) valorB = ordenAscendente ? "zzzzzzz" : "";
                    
                    let numA = parseFloat(valorA); let numB = parseFloat(valorB);
                    if (!isNaN(numA) && !isNaN(numB) && !valorA.includes("-") && !valorB.includes("-")) { return ordenAscendente ? numA - numB : numB - numA; }
                    if (valorA < valorB) return ordenAscendente ? -1 : 1; if (valorA > valorB) return ordenAscendente ? 1 : -1; return 0;
                }); 
                
                const fragment = document.createDocumentFragment(); filas.forEach(fila => fragment.appendChild(fila)); tbody.appendChild(fragment);
                document.getElementById('loadingOverlay').style.display = 'none';
            }, 50);
        };

        window.exportarAExcel = function() {
            let dataExcel = []; let encabezados = [...allCols]; dataExcel.push(encabezados);
            const filas = document.getElementById('tableBody').querySelectorAll('tr');
            filas.forEach(fila => {
                if(fila.style.display !== 'none') {
                    let filaData = [];
                    for(let i = 1; i <= 29; i++) {
                        let val = fila._datosOriginal[i] || "";
                        if(i === 1) val = fila.querySelector('.img-foto-prenda') && !fila.querySelector('.img-foto-prenda').src.includes('logo.png') ? "🖼️ Imagen Cargada" : "";
                        if(i === 29 && val.startsWith('data:application/pdf')) val = "📄 PDF Cargado en Sistema";
                        filaData.push(val);
                    }
                    dataExcel.push(filaData);
                }
            });
            const hoja = XLSX.utils.aoa_to_sheet(dataExcel); const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Patronaje"); XLSX.writeFile(libro, "Seguimiento_Patronaje.xlsx");
        };

        inicializarEncabezados(); cargarDatos();
    </script>
</body>
</html>
