<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento Técnico y Patronaje</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root { --w-col-0: 60px; --w-col-1: 100px; --w-col-6: 150px; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 25px; 
            background-image: linear-gradient(rgba(245, 247, 250, 0.88), rgba(230, 235, 242, 0.92)), url('fondo.png');
            background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            color: #1f2937; min-height: 100vh;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(0, 0, 0, 0.1); padding-bottom: 15px; }
        .titulo-bodega { font-size: 16px; font-weight: 800; color: #111827; text-transform: uppercase; letter-spacing: 1px; }
        .btn-logout { background-color: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2); transition: 0.2s; }
        .btn-logout:hover { background-color: #dc2626; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; flex-wrap: wrap; }
        .acciones-izq, .acciones-der { display: flex; gap: 10px; align-items: center; }

        .btn { padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: #374151; background-color: #ffffff; border: 1px solid #d1d5db; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03); transition: all 0.2s; }
        .btn:hover { background-color: #f3f4f6; color: #111827; border-color: #9ca3af; }
        
        .btn-save { background-color: #10b981; color: white; border: none; font-weight: 700; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); } 
        .btn-save:hover { background-color: #059669; color: white; transform: translateY(-1px); }
        
        .btn-bulk-delete { background-color: #fff1f2; color: #b91c1c; border: 1px solid #fda4af; display: none; }
        .btn-bulk-delete:hover { background-color: #fecdd3; color: #9f1239; }

        .search-input { width: 320px; padding: 9px 16px; border-radius: 8px; border: 1px solid #d1d5db; background-color: #ffffff; color: #111827; outline: none; font-size: 13px; }
        .search-input:focus { border-color: #3b82f6; }

        /* TABLA ESTILO EXCEL CLARO */
        .table-container { width: 100%; overflow-x: auto; max-height: 70vh; background: #ffffff; border-radius: 10px; border: 1px solid #d1d5db; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06); }
        table { border-collapse: collapse; width: max-content; }
        th, td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; position: relative; color: #374151; }
        thead { position: sticky; top: 0; z-index: 10; background-color: #f9fafb; }
        .th-title { cursor: pointer; user-select: none; color: #374151; font-weight: 600; font-size: 11px; text-transform: uppercase; background: #f3f4f6; padding: 10px; }
        .filter-input { width: 100%; padding: 4px 8px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 4px; background: #ffffff; color: #111827; box-sizing: border-box;}
        tbody tr:nth-child(even) { background-color: #f9fafb; }
        tbody tr:hover { background-color: #f3f4f6; }
        td[contenteditable="true"]:focus { background-color: #ffffff; box-shadow: inset 0 0 0 2px #374151; outline: none; color: #111827; z-index: 20;}

        /* CONGELACIÓN DE COLUMNAS */
        .col-checkbox { position: sticky !important; left: 0; background-color: #ffffff; z-index: 8; border-right: 1px solid #d1d5db !important; text-align: center; }
        th.col-checkbox { z-index: 19 !important; background-color: #f3f4f6 !important; }
        tbody tr:nth-child(even) td.col-checkbox { background-color: #f9fafb; }
        tbody tr:hover td.col-checkbox { background-color: #f3f4f6; }

        .col-precinto { position: sticky !important; left: var(--left-precinto, 60px); z-index: 8; background-color: #ffffff; border-right: 1px solid #e5e7eb; }
        .col-nombre { position: sticky !important; left: var(--left-nombre, 160px); z-index: 8; background-color: #ffffff; border-right: 1px solid #e5e7eb; }
        .col-pinta { position: sticky !important; left: var(--left-pinta, 260px); z-index: 8; background-color: #ffffff; border-right: 1px solid #e5e7eb; }
        .col-desc { position: sticky !important; left: var(--left-desc, 360px); z-index: 8; background-color: #ffffff; border-right: 2px solid #9ca3af !important; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }

        th.col-precinto, th.col-nombre, th.col-pinta, th.col-desc { z-index: 19 !important; background-color: #f3f4f6 !important; color: #374151; }
        tbody tr td.col-precinto, tbody tr td.col-nombre, tbody tr td.col-pinta, tbody tr td.col-desc { background-color: #ffffff; }
        tbody tr:nth-child(even) td.col-precinto, tbody tr:nth-child(even) td.col-nombre, tbody tr:nth-child(even) td.col-pinta, tbody tr:nth-child(even) td.col-desc { background-color: #f9fafb; }
        tbody tr:hover td.col-precinto, tbody tr:hover td.col-nombre, tbody tr:hover td.col-pinta, tbody tr:hover td.col-desc { background-color: #f3f4f6; }

        .resizer { position: absolute; top: 0; right: 0; width: 6px; cursor: col-resize; user-select: none; height: 100%; z-index: 25; }
        .resizer:hover, .resizer.resizing { background-color: #3b82f6; }

        .calc-cell { background-color: #f3f4f6; color: #6b7280; font-weight: bold; text-align: center; }

        /* MODALES */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background-color: #ffffff; padding: 30px; border-radius: 12px; width: 500px; color: #1f2937; border: 1px solid #e5e7eb; box-shadow: 0 10px 40px rgba(0,0,0,0.2);}
        #modalVisor { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; cursor: zoom-out; }
        #imagenAmpliada { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.8); object-fit: contain; }
    </style>
</head>
<body>

    <!-- OVERLAY DE CARGA PARA HISTÓRICOS PESADOS -->
    <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column; backdrop-filter: blur(5px);">
        <div style="font-size:40px; margin-bottom:10px;">⏳</div>
        <div style="font-size:22px; font-weight:800; color:#1f2937; margin-bottom:10px;">Procesando Histórico</div>
        <div id="loadingText" style="font-size:15px; color:#6b7280; font-weight: 600;">Por favor, espera unos segundos...</div>
    </div>

    <script>
        const styleEl = document.createElement('style');
        let cssRules = "";
        for(let i=0; i<=35; i++) {
            cssRules += `th:nth-child(${i+1}), td:nth-child(${i+1}) { width: var(--w-col-${i}, 140px) !important; min-width: var(--w-col-${i}, 140px) !important; max-width: var(--w-col-${i}, 400px) !important; }\n`;
        }
        styleEl.innerHTML = cssRules; document.head.appendChild(styleEl);
    </script>

    <div class="top-bar">
        <div class="titulo-bodega">ÁREA DE PATRONAJE Y DPTO TÉCNICO</div>
        <div style="display: flex; align-items: center;">
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="header-actions">
        <div class="acciones-izq">
            <button class="btn btn-save" id="btnGuardarGlobal" onclick="guardarCambiosVisibles()">💾 Guardar Cambios</button>
            <button class="btn" onclick="exportarAExcel()">📥 Exportar Excel</button>
            
            <button class="btn" onclick="document.getElementById('inputImportarExcel').click()">📤 Importar Excel Histórico</button>
            <input type="file" id="inputImportarExcel" accept=".xlsx, .xls" style="display:none;" onchange="procesarExcelImportado(event)">

            <button class="btn" onclick="abrirBuscadorDiseno()" style="background-color: #2563eb; color:white; border:none;">➕ Importar desde Diseño</button>
            
            <div id="bulkActions" style="display: none; align-items: center; gap: 8px; margin-left: 15px; border-left: 2px solid #d1d5db; padding-left: 15px;">
                <span id="selectedCount" style="font-size: 13px; font-weight: 700; color: #ef4444;">0 selec.</span>
                <button class="btn btn-bulk-delete" id="btnEliminarMasivo" onclick="eliminarSeleccionadas()">🗑️ Eliminar Masivo</button>
            </div>
        </div>
        <div class="acciones-der">
            <input type="text" id="inputBusquedaGlobal" class="search-input" placeholder="🔍 Buscar en cualquier columna..." oninput="ejecutarFiltro()">
        </div>
    </div>

    <div class="table-container">
        <table id="tablaWips">
            <thead>
                <tr id="tableHeaderRow"></tr>
                <tr id="tableFilterRow"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- MODAL: IMPORTAR DE DISEÑO -->
    <div id="modal-agregar" class="modal">
        <div class="modal-content">
            <h3 style="color: #2563eb; margin-top: 0; font-size: 20px;">➕ Importar Prenda a Patronaje</h3>
            <label style="color:#6b7280; font-size: 13px;">Escribe el Precinto entregado por Diseño para crear su ficha técnica:</label>
            <div style="display:flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="inputBuscarPrecinto" placeholder="Ej: MST-10293" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; background: #ffffff; color: #111827; outline: none;">
                <button class="btn" style="background-color: #1f2937; color: white; border: none;" onclick="buscarPrecintoEnDiseno(event)">🔍 Buscar</button>
            </div>
            <div id="resultadoBusqueda" style="margin-top: 25px; display:none; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px dashed #d1d5db;"></div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn" onclick="cerrarModal('modal-agregar')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- VISOR IMAGEN -->
    <div id="modalVisor" onclick="cerrarModal('modalVisor')"><img id="imagenAmpliada"></div>

    <script>
        const URL_PROYECTO = 'https://emljzsxypeqecevffmwr.supabase.co'; 
        const KEY_PROYECTO = 'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W';
        const client = window.supabase.createClient(URL_PROYECTO, KEY_PROYECTO, { auth: { storage: window.localStorage } });
        
        const allCols = [
            'FOTO', 'FECHA DE INGRESO:', 'PROVEEDOR:', 'DISEÑADOR:', 'COLECCIÓN:', 'GÉNERO', 'PRECINTO',
            'NOMBRE / REFERENCIA:', 'TALLA', 'TIPO DE MUESTRA:', 'PINTA:', 'CANTIDAD:', 'DESCRIPCIÓN TIPO DE PRENDA:',
            'SILUETA', 'DISEÑO', 'NIVEL DE PRIORIDAD:', 'MEDICIÓN:', 'HOJA MEDIDAS:', 'FECHA ENVIO:',
            'FECHA RECIBIDO:', 'FECHA ENTREGA (AUDITORÍA)', 'AUDITOR:', 'LEAD TIME AUD',
            'RESULTADO', 'MOTIVO 1', 'MOTIVO 2', 'MOTIVO 3', 'FECHA ENTREGA2', 'AUDITOR.',
            'LEAD TIME ENTREGA', 'LEAD TIME GENERAL', 'TIPO', 'PDF AUDITORÍA'
        ];

        const listaMotivos = [
            "", "% ENCOGIMIENTO", "ARTES", "ASIMETRIA", "ASPECTO", "BORDADO", "CALIDAD", "CAMBIO DE SILUETA",
            "CAMBIO EN DISEÑO", "CASES", "COLOR", "CONFECCION", "CREMALLERA", "CREMALLERA ONDULADA", "CUELLO ONDULADO",
            "DECOLORACIÓN", "DESCOSIDOS", "DESPEGADO", "DESPISTE", "DISEÑO", "ELÁSTICO", "ESTAMPADO", "ETIQUETA",
            "FIBRAS EXPUESTAS", "HILOS", "HORMA", "INCOMODO", "INSUMOS", "LASER", "LOOK", "MARQUILLA", "MARRAS",
            "MEDIDAS", "MOLDERÍA", "PEGANTE EXPUESTO", "PELADO", "PIEZA TEJIDA", "PIEZA VIRADA", "PILLING", "PLANCHA",
            "POROS", "PROCESO LAVADO", "RANURAS DEFORMADAS", "RASPADO", "ROTOS", "TALLONES", "TEJIDO FRIZADO", "TELA",
            "TRANSFERENCIA COLOR", "TRASLUCE EL FORRO", "VACIOS"
        ];

        const mapeoTipo = {
            "ORIGINAL": "DESARROLLO", "PHOTO SAMPLE": "PRODUCCION", "PP SAMPLE": "DESARROLLO", "PROTO": "DESARROLLO",
            "SIZE SET PP SAMPLE": "DESARROLLO", "SIZE SET PHOTO SAMPLE": "PRODUCCION", "2DA PHOTO SAMPLE": "PRODUCCION",
            "3RA PHOTO SAMPLE": "PRODUCCION", "4TA PHOTO SAMPLE": "PRODUCCION", "SHIPPING SAMPLE": "PRODUCCION",
            "2DA PP SAMPLE": "DESARROLLO", "2DO SIZE SET PP SAMPLE": "DESARROLLO", "3RA PP SAMPLE": "DESARROLLO",
            "4TA PP SAMPLE": "DESARROLLO", "5TA PP SAMPLE": "DESARROLLO", "2 PP SAMPLE": "DESARROLLO",
            "MUESTRA ORIGINAL": "DESARROLLO", "SIZE SET PROTO": "DESARROLLO"
        };

        // --- MANEJO DE BUSCADOR CON RETRASO (DEBOUNCE) PARA NO CONGELAR ---
        let timerBusqueda = null;
        window.ejecutarFiltro = function() {
            clearTimeout(timerBusqueda);
            timerBusqueda = setTimeout(() => {
                window.filtrarTablaCompleta();
            }, 350); 
        };

        async function verificarSesion() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) window.location.href = "index_patronaje.html";
        }
        window.cerrarSesion = async function() { await client.auth.signOut(); window.location.href = "index_patronaje.html"; }
        verificarSesion();

        // --- MANEJO DE ARCHIVOS Y FOTOS ---
        window.cambiarFotoFila = function(input) {
            if(input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    const img = input.closest('td').querySelector('.img-foto-prenda');
                    img.src = e.target.result;
                    recalcularFila(input.closest('tr')); 
                }; reader.readAsDataURL(input.files[0]);
            }
        };

        window.subirPdfFila = function(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                if(file.size > 2.5 * 1024 * 1024) { return alert("El PDF es muy pesado. Sube un archivo menor a 2.5MB."); }
                let reader = new FileReader();
                reader.onload = function(e) {
                    const td = input.closest('td'); const base64 = e.target.result;
                    td.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px;">
                            <a href="${base64}" download="Auditoria.pdf" style="color:#ef4444; font-weight:bold; font-size:12px; text-decoration:none;">📄 Ver PDF</a>
                            <button onclick="eliminarPdf(this)" style="background:transparent; border:none; cursor:pointer;" title="Quitar">❌</button>
                            <input type="hidden" value="${base64}" class="pdf-data">
                        </div>`;
                    recalcularFila(td.closest('tr'));
                }; reader.readAsDataURL(file);
            }
        };

        window.eliminarPdf = function(btn) {
            const td = btn.closest('td');
            td.innerHTML = `
                <button onclick="this.nextElementSibling.click()" class="btn" style="padding: 4px 8px; font-size:11px;">📎 Subir PDF</button>
                <input type="file" accept=".pdf" style="display:none;" onchange="subirPdfFila(this)">
                <input type="hidden" value="" class="pdf-data">
            `;
            recalcularFila(td.closest('tr'));
        };

        // --- CÁLCULOS AUTOMÁTICOS ---
        function calcularDiasHabiles(fechaInicioStr, fechaFinStr) {
            if (!fechaInicioStr || !fechaFinStr) return "";
            let start = new Date(fechaInicioStr); let end = new Date(fechaFinStr);
            if (isNaN(start) || isNaN(end) || start > end) return "";
            let count = 0; let current = new Date(start);
            while (current <= end) {
                let dayOfWeek = current.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { count++; }
                current.setDate(current.getDate() + 1);
            } return count.toString();
        }

        window.recalcularFila = function(tr) {
            const celdas = tr.querySelectorAll('td');
            const fIngreso = celdas[2].querySelector('input') ? celdas[2].querySelector('input').value : celdas[2].innerText.trim();
            const fEntAud = celdas[21].querySelector('input') ? celdas[21].querySelector('input').value : celdas[21].innerText.trim();
            const res = celdas[24].querySelector('select') ? celdas[24].querySelector('select').value : celdas[24].innerText.trim();
            const fEntFich = celdas[28].querySelector('input') ? celdas[28].querySelector('input').value : celdas[28].innerText.trim();
            const tipoMuestra = celdas[10].innerText.trim().toUpperCase();

            celdas[23].textContent = (fIngreso && fEntAud) ? calcularDiasHabiles(fIngreso, fEntAud) : "";
            celdas[30].textContent = (fIngreso && fEntAud) ? calcularDiasHabiles(fIngreso, fEntAud) : "";

            if (fEntFich === "") { celdas[31].textContent = ""; } 
            else if (res === "CANCELADO" || res === "OBSEQUIO") { celdas[31].textContent = "0"; } 
            else if (fIngreso && fEntFich) { celdas[31].textContent = calcularDiasHabiles(fIngreso, fEntFich); } 
            else { celdas[31].textContent = ""; }

            let tipoCalculado = mapeoTipo[tipoMuestra] || "";
            if(tipoCalculado === "") { for (const key in mapeoTipo) { if (tipoMuestra.includes(key)) { tipoCalculado = mapeoTipo[key]; break; } } }
            celdas[32].textContent = tipoCalculado;

            tr._datosOriginal = [];
            tr._datosLower = [];
            for(let i = 1; i <= 33; i++) {
                if(!celdas[i]) continue;
                let val = "";
                if (i === 1) val = ""; 
                else if (celdas[i].querySelector('select')) val = celdas[i].querySelector('select').value;
                else if (celdas[i].querySelector('input[type="date"]')) val = celdas[i].querySelector('input[type="date"]').value;
                else val = celdas[i].innerText.trim();
                
                tr._datosOriginal[i] = val;
                tr._datosLower[i] = val.toLowerCase();
            }
            tr._textoGlobal = tr._datosLower.join(" ");
        };

        // --- ACTUALIZADOR DE COLUMNAS STICKY ---
        window.actualizarSticky = function() {
            const trHeader = document.getElementById('tableHeaderRow');
            if(!trHeader) return;
            const ths = trHeader.querySelectorAll('th');
            if(ths.length < 15) return;
            
            let leftPos = ths[0].offsetWidth; 
            
            document.documentElement.style.setProperty('--left-precinto', `${leftPos}px`);
            leftPos += ths[7].offsetWidth; // 7 corresponde a PRECINTO
            
            document.documentElement.style.setProperty('--left-nombre', `${leftPos}px`);
            leftPos += ths[8].offsetWidth; // 8 corresponde a NOMBRE
            
            document.documentElement.style.setProperty('--left-pinta', `${leftPos}px`);
            leftPos += ths[11].offsetWidth; // 11 corresponde a PINTA
            
            document.documentElement.style.setProperty('--left-desc', `${leftPos}px`);
        };

        window.addEventListener('resize', window.actualizarSticky);

        // --- INICIALIZACIÓN Y TABLA ---
        function inicializarEncabezados() {
            const trHeader = document.getElementById('tableHeaderRow'); const trFilter = document.getElementById('tableFilterRow');
            const thCheck = document.createElement('th'); thCheck.className = 'col-checkbox'; thCheck.innerHTML = `<input type="checkbox" id="selectAll" onclick="toggleSelectAll()">`;
            trHeader.appendChild(thCheck); trFilter.appendChild(document.createElement('th')).className = 'col-checkbox';

            allCols.forEach((col, idx) => { 
                const thTitle = document.createElement('th'); thTitle.className = 'th-title'; thTitle.innerHTML = `${col} ↕`; thTitle.onclick = () => ordenarTabla(idx + 1);
                
                // Clases Sticky para inmovilizar
                if (col === 'PRECINTO') thTitle.classList.add('col-precinto');
                if (col === 'NOMBRE / REFERENCIA:') thTitle.classList.add('col-nombre');
                if (col === 'PINTA:') thTitle.classList.add('col-pinta');
                if (col === 'DESCRIPCIÓN TIPO DE PRENDA:') thTitle.classList.add('col-desc');

                trHeader.appendChild(thTitle);
                
                let resizer = document.createElement('div'); resizer.className = 'resizer'; thTitle.appendChild(resizer);
                let x = 0; let w = 0;
                resizer.addEventListener('mousedown', function(e) {
                    x = e.clientX; w = parseInt(window.getComputedStyle(thTitle).width, 10);
                    const mouseMoveHandler = (ev) => { 
                        document.documentElement.style.setProperty(`--w-col-${idx + 1}`, `${Math.max(40, w + ev.clientX - x)}px`); 
                        window.actualizarSticky();
                    };
                    const mouseUpHandler = () => { 
                        document.removeEventListener('mousemove', mouseMoveHandler); 
                        document.removeEventListener('mouseup', mouseUpHandler); 
                        window.actualizarSticky();
                    };
                    document.addEventListener('mousemove', mouseMoveHandler); document.addEventListener('mouseup', mouseUpHandler);
                });

                const thFilter = document.createElement('th');
                if (col === 'PRECINTO') thFilter.classList.add('col-precinto');
                if (col === 'NOMBRE / REFERENCIA:') thFilter.classList.add('col-nombre');
                if (col === 'PINTA:') thFilter.classList.add('col-pinta');
                if (col === 'DESCRIPCIÓN TIPO DE PRENDA:') thFilter.classList.add('col-desc');

                if (col === 'FOTO' || col === 'PDF AUDITORÍA') { thFilter.innerHTML = ``; } 
                else if (col.includes('FECHA') || col.includes('MEDICIÓN:') || col.includes('HOJA MEDIDAS:')) {
                    thFilter.innerHTML = `<input type="date" class="filter-input col-filter" data-colindex="${idx + 1}" oninput="ejecutarFiltro()">`;
                } else {
                    thFilter.innerHTML = `<input type="text" class="filter-input col-filter" list="datalist_${idx + 1}" data-colindex="${idx + 1}" placeholder="Filtrar..." oninput="ejecutarFiltro()"><datalist id="datalist_${idx + 1}"></datalist>`;
                } trFilter.appendChild(thFilter);

        async function cargarDatos() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').innerText = "Conectando con la base de datos...";
            
            let allData = [];
            let from = 0;
            const step = 1000;
            let fetching = true;

            while (fetching) {
                document.getElementById('loadingText').innerText = `Descargando registros desde la nube: ${allData.length}...`;
                const { data, error } = await client.from('dpto_tecnico')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .range(from, from + step - 1);
                    
                if (error) { 
                    console.error(error); 
                    document.getElementById('loadingOverlay').style.display = 'none'; 
                    alert("Hubo un error descargando la información.");
                    return; 
                }
                
                if (data && data.length > 0) {
                    allData = allData.concat(data);
                    from += step;
                } else {
                    fetching = false;
                }
                
                if (data.length < step) {
                    fetching = false;
                }
            }

            const tbody = document.getElementById('tableBody'); 
            tbody.innerHTML = ''; 
            
            if(!allData || allData.length === 0) { 
                document.getElementById('loadingOverlay').style.display = 'none'; 
                return; 
            }

            let i = 0;
            const chunkSize = 150; 
            
            function renderChunk() {
                const fragment = document.createDocumentFragment();
                const end = Math.min(i + chunkSize, allData.length);
                for (; i < end; i++) {
                    let d = allData[i].datos || []; while(d.length < 33) d.push(""); 
                    fragment.appendChild(crearFilaHTML(allData[i].id, d));
                }
                tbody.appendChild(fragment);
                
                if (i < allData.length) {
                    document.getElementById('loadingText').innerText = `Dibujando muestras en pantalla: ${i} de ${allData.length}...`;
                    requestAnimationFrame(renderChunk);
                } else {
                    window.ejecutarFiltro(); 
                    window.actualizarDatalists();
                    window.actualizarSticky();
                    document.getElementById('loadingOverlay').style.display = 'none';
                }
            }
            renderChunk();
        }

        window.extraerDatosFila = function(tr) {

                    const img = celdas[i].querySelector('.img-foto-prenda'); datosFila.push((img && !img.src.includes('logo.png')) ? img.src : "");
                } else if (i === 33) {
                    const pdfInput = celdas[i].querySelector('.pdf-data'); datosFila.push(pdfInput ? pdfInput.value : "");
                } else if (celdas[i].querySelector('select')) { 
                    datosFila.push(celdas[i].querySelector('select').value);

                    datosFila.push(celdas[i].querySelector('input[type="date"]').value);

        window.guardarCambiosVisibles = async function() {
            const btn = document.getElementById('btnGuardarGlobal'); const textoOriginal = btn.innerHTML;
            btn.innerHTML = "⏳ Guardando..."; btn.disabled = true;
            
            const filas = document.getElementById('tableBody').querySelectorAll('tr'); 
            let registrosGuardar = [];

            for (let tr of filas) {
                if (tr.style.display === 'none') continue; 
                let datosFila = window.extraerDatosFila(tr);
                if (tr.dataset.id) { 
                    registrosGuardar.push({ id: tr.dataset.id, datos: datosFila, precinto: datosFila[6] }); 
                } 
            }
            
            try {
                const chunkSize = 150;
                for (let i = 0; i < registrosGuardar.length; i += chunkSize) {
                    const chunk = registrosGuardar.slice(i, i + chunkSize);
                    const { error } = await client.from('dpto_tecnico').upsert(chunk);
                    if (error) throw error;
                }
                
                btn.innerHTML = "✅ ¡Todo guardado!"; 
                actualizarDatalists(); 
            } catch (err) { 
                console.error(err); alert("Hubo un error al guardar: " + err.message); btn.innerHTML = "❌ Error";

        window.procesarExcelImportado = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: true });

                    if (jsonRows.length <= 1) return alert("El archivo está vacío o solo tiene encabezados.");

                    const rowsData = jsonRows.slice(1);
                    let registrosInsert = [];
                    
                    const columnasFechas = [1, 16, 17, 18, 19, 20, 27];

                    function convertirFechaExcel(val) {
                        if (!val) return "";
                        let num = Number(val);
                        if (!isNaN(num) && num > 20000) {
                            let date = new Date(Math.round((num - 25569) * 86400 * 1000));
                            date = new Date(date.getTime() + date.getTimezoneOffset() * 60000);
                            return date.toISOString().split('T')[0];
                        }
                        if (typeof val === 'string' && val.includes('/')) {
                            let p = val.split('/');
                            if(p.length === 3 && p[2].length === 4) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                        }
                        if (typeof val === 'string' && val.includes('-')) return val.substring(0,10);
                        return String(val);
                    }

                    rowsData.forEach(row => {
                        let d = new Array(33).fill('');
                        for (let i = 0; i < 33; i++) {
                            let val = row[i] !== undefined && row[i] !== null ? row[i] : '';
                            if (columnasFechas.includes(i)) {
                                d[i] = convertirFechaExcel(val);
                            } else {
                                d[i] = String(val);
                            }
                        }
                        
                        const precinto = d[6] ? d[6].trim() : '';
                        if (precinto !== '') {
                            if (d[0].includes("Imagen Cargada")) d[0] = "";
                            if (d[32].includes("PDF Cargado")) d[32] = "";
                            registrosInsert.push({ precinto: precinto, datos: d });
                        }
                    });

                    if (registrosInsert.length === 0) return alert("No se encontraron filas con PRECINTO válido.");
                    
                    alert(`⏳ Subiendo ${registrosInsert.length} muestras. Por favor no cierres la página ni presiones F5...`);
                    
                    const chunkSize = 200;
                    for (let i = 0; i < registrosInsert.length; i += chunkSize) {
                        const chunk = registrosInsert.slice(i, i + chunkSize);
                        const { error } = await client.from('dpto_tecnico').insert(chunk);
                        if (error) throw error;
                    }

                    alert("✅ ¡Carga masiva de histórico completada exitosamente!");
                    event.target.value = ""; 
                    cargarDatos(); 
                } catch (error) {
                    console.error(error); alert("Error al importar: " + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.filtrarTablaCompleta = function() {
            const textoGlobal = document.getElementById('inputBusquedaGlobal').value.toLowerCase();
            const inputsColumnas = Array.from(document.querySelectorAll('.col-filter')).map(inp => ({
                index: parseInt(inp.getAttribute('data-colindex')),

                raw: inp.value.trim()
            })).filter(inp => inp.val !== "");

            const filas = document.getElementById('tableBody').querySelectorAll('tr');
            
            filas.forEach(fila => {
                let mostrar = true;
                
                if (textoGlobal && !fila._textoGlobal.includes(textoGlobal)) {
                    mostrar = false;
                } else if (inputsColumnas.length > 0) {
                    for (let inp of inputsColumnas) {
                        let celdaTexto = fila._datosLower[inp.index] || "";
                        if (inp.raw.startsWith('"') && inp.raw.endsWith('"')) {
                            let exactTerm = inp.val.slice(1, -1).trim(); 
                            if (exactTerm !== celdaTexto) { mostrar = false; break; }
                        } else if (!celdaTexto.includes(inp.val)) { 
                            mostrar = false; break; 
                        }
                    }
                }
                
                if (mostrar) {
                    if (fila.style.display === 'none') fila.style.display = '';
                } else {
                    if (fila.style.display !== 'none') fila.style.display = 'none';
                    const cb = fila.querySelector('.row-checkbox'); 
                    if (cb && cb.checked) cb.checked = false;
                }
            });
            window.actualizarSeleccion(); 
        };

        let columnaOrdenadaActual = -1; let ordenAscendente = true;
        window.ordenarTabla = function(colIndex) {
            const tbody = document.getElementById('tableBody');

            if (filas.length === 0) return;
            
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').innerText = `Ordenando ${filas.length} registros...`;
            
            setTimeout(() => {
                if (columnaOrdenadaActual === colIndex) { 
                    ordenAscendente = !ordenAscendente; 
                } else { 
                    ordenAscendente = true; 
                    columnaOrdenadaActual = colIndex; 
                }
                
                filas.sort((a, b) => {
                    let valorA = a._datosOriginal ? a._datosOriginal[colIndex] : ""; 
                    let valorB = b._datosOriginal ? b._datosOriginal[colIndex] : "";
                    
                    if (!valorA) valorA = ordenAscendente ? "zzzzzzz" : ""; 
                    if (!valorB) valorB = ordenAscendente ? "zzzzzzz" : "";
                    
                    let numA = parseFloat(valorA); 
                    let numB = parseFloat(valorB);
                    
                    if (!isNaN(numA) && !isNaN(numB) && !valorA.includes("-") && !valorB.includes("-")) {
                        return ordenAscendente ? numA - numB : numB - numA;
                    }
                    
                    if (valorA < valorB) return ordenAscendente ? -1 : 1; 
                    if (valorA > valorB) return ordenAscendente ? 1 : -1; 
                    return 0;
                }); 
                
                const fragment = document.createDocumentFragment();
                filas.forEach(fila => fragment.appendChild(fila));
                tbody.appendChild(fragment);
                
                document.getElementById('loadingOverlay').style.display = 'none';
            }, 50);
        };

        window.exportarAExcel = function() {
            let dataExcel = []; let encabezados = [...allCols]; dataExcel.push(encabezados);
            const filas = document.getElementById('tableBody').querySelectorAll('tr');
            filas.forEach(fila => {
                if(fila.style.display !== 'none') {
                    let filaData = [];
                    for(let i = 1; i <= 33; i++) {
                        let val = fila._datosOriginal[i] || "";
                        if(i === 1) val = fila.querySelector('.img-foto-prenda') && !fila.querySelector('.img-foto-prenda').src.includes('logo.png') ? "🖼️ Imagen Cargada" : "";
                        if(i === 33 && val.startsWith('data:application/pdf')) val = "📄 PDF Cargado en Sistema";
                        filaData.push(val);
                    }
                    dataExcel.push(filaData);
                }
            });
            const hoja = XLSX.utils.aoa_to_sheet(dataExcel); const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Patronaje"); XLSX.writeFile(libro, "Seguimiento_Patronaje.xlsx");
        };

        inicializarEncabezados(); cargarDatos();
    </script>
