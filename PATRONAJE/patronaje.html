<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento Técnico y Patronaje</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root { --w-col-0: 60px; --w-col-1: 100px; --w-col-7: 150px; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 25px; 
            background-image: linear-gradient(rgba(245, 247, 250, 0.88), rgba(230, 235, 242, 0.92)), url('fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #1f2937; 
            min-height: 100vh;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(0, 0, 0, 0.1); padding-bottom: 15px; }
        .titulo-bodega { font-size: 16px; font-weight: 800; color: #111827; text-transform: uppercase; letter-spacing: 1px; }
        .en-linea-container { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #6b7280; font-weight: 600; }
        .avatars-group { display: flex; flex-direction: row-reverse; }
        .avatar-circle { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: white; border: 2px solid #ffffff; margin-left: -12px; position: relative; cursor: default; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: 0.2s; }
        .avatar-circle:hover { transform: translateY(-3px); z-index: 10; }
        .avatar-circle:hover::after { content: attr(data-name); position: absolute; top: 110%; background: #1f2937; padding: 5px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap; z-index: 20; color: #fff; }
        .btn-logout { background-color: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin-left: 15px; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2); }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; flex-wrap: wrap; }
        .acciones-izq, .acciones-der { display: flex; gap: 10px; align-items: center; }

        .btn { padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: #374151; background-color: #ffffff; border: 1px solid #d1d5db; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03); transition: all 0.2s; }
        .btn:hover { background-color: #f3f4f6; color: #111827; border-color: #9ca3af; }
        
        .btn-save { background-color: #10b981; color: white; border: none; font-weight: 700; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); } 
        .btn-save:hover { background-color: #059669; color: white; border: none; transform: translateY(-1px); }
        
        .btn-bulk-delete { background-color: #fff1f2; color: #b91c1c; border: 1px solid #fda4af; display: none; }
        .btn-bulk-delete:hover { background-color: #fecdd3; color: #9f1239; }

        .search-input { width: 320px; padding: 9px 16px; border-radius: 8px; border: 1px solid #d1d5db; background-color: #ffffff; color: #111827; outline: none; font-size: 13px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03); }
        .search-input:focus { border-color: #3b82f6; }

        /* TABLA ESTILO EXCEL CLARO */
        .table-container { width: 100%; overflow-x: auto; max-height: 70vh; background: #ffffff; border-radius: 10px; border: 1px solid #d1d5db; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06); }
        table { border-collapse: collapse; width: max-content; }
        th, td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; position: relative; color: #374151; }
        thead { position: sticky; top: 0; z-index: 10; background-color: #f9fafb; }
        .th-title { cursor: pointer; user-select: none; color: #374151; font-weight: 600; font-size: 11px; text-transform: uppercase; background: #f3f4f6; padding: 10px; }
        .filter-input { width: 100%; padding: 4px 8px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 4px; background: #ffffff; color: #111827; box-sizing: border-box;}
        tbody tr:nth-child(even) { background-color: #f9fafb; }
        tbody tr:hover { background-color: #f3f4f6; }
        td[contenteditable="true"]:focus { background-color: #ffffff; box-shadow: inset 0 0 0 2px #374151; outline: none; color: #111827; z-index: 20;}

        .col-checkbox { position: sticky !important; left: 0; background-color: #ffffff; z-index: 8; border-right: 1px solid #d1d5db !important; text-align: center; }
        th.col-checkbox { z-index: 19 !important; background-color: #f3f4f6 !important; }
        tbody tr:nth-child(even) td.col-checkbox { background-color: #f9fafb; }
        tbody tr:hover td.col-checkbox { background-color: #f3f4f6; }

        .resizer { position: absolute; top: 0; right: 0; width: 6px; cursor: col-resize; user-select: none; height: 100%; z-index: 25; }
        .resizer:hover, .resizer.resizing { background-color: #3b82f6; }

        /* MODALES */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background-color: #ffffff; padding: 30px; border-radius: 12px; width: 500px; color: #1f2937; border: 1px solid #e5e7eb; box-shadow: 0 10px 40px rgba(0,0,0,0.2);}
        
        #modalVisor { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; cursor: zoom-out; }
        #imagenAmpliada { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.8); object-fit: contain; }
    </style>
</head>
<body>

    <script>
        // CSS Dinámico para redimensionar columnas
        const styleEl = document.createElement('style');
        let cssRules = "";
        for(let i=0; i<=35; i++) {
            cssRules += `th:nth-child(${i+1}), td:nth-child(${i+1}) { width: var(--w-col-${i}, 130px) !important; min-width: var(--w-col-${i}, 130px) !important; max-width: var(--w-col-${i}, 400px) !important; }\n`;
        }
        styleEl.innerHTML = cssRules; document.head.appendChild(styleEl);
    </script>

    <div class="top-bar">
        <div class="titulo-bodega">ÁREA DE PATRONAJE Y DPTO TÉCNICO</div>
        <div style="display: flex; align-items: center;">
            <div class="en-linea-container"><span>En línea:</span><div id="usuarios-activos" class="avatars-group"></div></div>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="header-actions">
        <div class="acciones-izq">
            <button class="btn btn-save" id="btnGuardarGlobal" onclick="guardarCambiosVisibles()">💾 Guardar Cambios</button>
            <button class="btn" onclick="exportarAExcel()">📥 Exportar Excel</button>
            <button class="btn" onclick="abrirBuscadorDiseno()">➕ Importar desde Diseño</button>
            
            <div id="bulkActions" style="display: none; align-items: center; gap: 8px; margin-left: 15px; border-left: 2px solid #d1d5db; padding-left: 15px;">
                <span id="selectedCount" style="font-size: 13px; font-weight: 700; color: #ef4444;">0 selec.</span>
                <button class="btn btn-bulk-delete" id="btnEliminarMasivo" onclick="eliminarSeleccionadas()">🗑️ Eliminar Masivo</button>
            </div>
        </div>
        <div class="acciones-der">
            <input type="text" id="inputBusquedaGlobal" class="search-input" placeholder="🔍 Buscar en cualquier columna..." oninput="filtrarTablaCompleta()">
        </div>
    </div>

    <div class="table-container">
        <table id="tablaWips">
            <thead>
                <tr id="tableHeaderRow"></tr>
                <tr id="tableFilterRow"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- MODAL: IMPORTAR DE DISEÑO -->
    <div id="modal-agregar" class="modal">
        <div class="modal-content">
            <h3 style="color: #10b981; margin-top: 0; font-size: 20px;">➕ Importar desde Diseño</h3>
            <label style="color:#6b7280; font-size: 13px;">Escribe el Precinto de la muestra entregada por Diseño para crear su fila técnica:</label>
            <div style="display:flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="inputBuscarPrecinto" placeholder="Ej: MST-10293" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; background: #ffffff; color: #111827; outline: none;">
                <button class="btn" style="background-color: #2563eb; color: white; border: none;" onclick="buscarPrecintoEnDiseno(event)">🔍 Buscar</button>
            </div>
            <div id="resultadoBusqueda" style="margin-top: 25px; display:none; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px dashed #d1d5db;"></div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn" onclick="cerrarModal('modal-agregar')">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- VISOR IMAGEN -->
    <div id="modalVisor" onclick="cerrarModal('modalVisor')"><img id="imagenAmpliada"></div>

    <script>
        const URL_PROYECTO = 'https://emljzsxypeqecevffmwr.supabase.co'; 
        const KEY_PROYECTO = 'sb_publishable_Y4Cv4QiSPSio1hO4eWvl4A_iTigJS0W';
        const client = window.supabase.createClient(URL_PROYECTO, KEY_PROYECTO, { auth: { storage: window.localStorage } });
        
        // LAS 31 COLUMNAS EXACTAS DE TU EXCEL + FOTO
        const allCols = [
            'FOTO', 'FECHA DE INGRESO', 'PROVEEDOR', 'DISEÑADOR', 'COLECCIÓN', 'GÉNERO', 'PRECINTO',
            'NOMBRE / REFERENCIA', 'M', 'TIPO DE MUESTRA', 'PINTA', 'CANTIDAD', 'DESCRIPCIÓN TIPO DE PRENDA',
            'SILUETA', 'DISEÑO', 'NIVEL DE PRIORIDAD', 'MEDICIÓN', 'HOJA MEDIDAS', 'FECHA ENVIO (PRUEBAS)',
            'FECHA RECIBIDO (PRUEBAS)', 'FECHA ENTREGA (AUDITORÍA)', 'AUDITOR CALIDAD', 'LEAD TIME AUD',
            'RESULTADO', 'MOTIVO 1', 'MOTIVO 2', 'MOTIVO 3', 'FECHA ENTREGA (FICHA)', 'AUDITOR FICHA',
            'LEAD TIME ENTREGA', 'LEAD TIME GENERAL', 'TIPO'
        ];

        // --- PRESENCIA ---
        function generarColorHash(str) { let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash); const c = (hash & 0x00FFFFFF).toString(16).toUpperCase(); return '#' + '00000'.substring(0, 6 - c.length) + c; }
        function obtenerIniciales(email) { return email.substring(0, 2).toUpperCase(); }

        async function configurarPresencia(emailUsuario) {
            const canal = client.channel('room-bodega', { config: { presence: { key: emailUsuario } } });
            canal.on('presence', { event: 'sync' }, () => {
                const state = canal.presenceState(); const container = document.getElementById('usuarios-activos'); container.innerHTML = '';
                Object.keys(state).forEach(email => {
                    const div = document.createElement('div'); div.className = 'avatar-circle'; div.style.backgroundColor = generarColorHash(email); div.setAttribute('data-name', email.split('@')[0]); div.innerText = obtenerIniciales(email); container.appendChild(div);
                });
            });
            canal.subscribe(async (status) => { if (status === 'SUBSCRIBED') await canal.track({ user_email: emailUsuario, online_at: new Date().toISOString() }); });
        }

        async function verificarSesion() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) window.location.href = "index_patronaje.html"; else configurarPresencia(session.user.email);
        }
        window.cerrarSesion = async function() { await client.auth.signOut(); window.location.href = "index_patronaje.html"; }
        verificarSesion();

        // --- ESTRUCTURA DE LA TABLA (EXCEL LIKE) ---
        function initResizer(th, colIndex) {
            const resizer = document.createElement('div'); resizer.className = 'resizer'; th.appendChild(resizer);
            let x = 0; let w = 0;
            const mouseDownHandler = function(e) {
                x = e.clientX; w = parseInt(window.getComputedStyle(th).width, 10);
                document.addEventListener('mousemove', mouseMoveHandler); document.addEventListener('mouseup', mouseUpHandler);
                resizer.classList.add('resizing');
            };
            const mouseMoveHandler = function(e) {
                const dx = e.clientX - x; let newWidth = w + dx; if (newWidth < 40) newWidth = 40; 
                document.documentElement.style.setProperty(`--w-col-${colIndex}`, `${newWidth}px`);
            };
            const mouseUpHandler = function() {
                document.removeEventListener('mousemove', mouseMoveHandler); document.removeEventListener('mouseup', mouseUpHandler);
                resizer.classList.remove('resizing');
            };
            resizer.addEventListener('mousedown', mouseDownHandler);
        }

        function inicializarEncabezados() {
            const trHeader = document.getElementById('tableHeaderRow'); const trFilter = document.getElementById('tableFilterRow');
            
            const thCheck = document.createElement('th'); thCheck.className = 'col-checkbox';
            thCheck.innerHTML = `<input type="checkbox" id="selectAll" onclick="toggleSelectAll()">`;
            trHeader.appendChild(thCheck);
            trFilter.appendChild(document.createElement('th')).className = 'col-checkbox';

            allCols.forEach((col, idx) => { 
                const thTitle = document.createElement('th'); thTitle.className = 'th-title';
                thTitle.innerHTML = `${col} ↕`; thTitle.onclick = () => ordenarTabla(idx + 1);
                trHeader.appendChild(thTitle); initResizer(thTitle, idx + 1); 

                const thFilter = document.createElement('th');
                if (col === 'FOTO') {
                    thFilter.innerHTML = ``;
                } else if (col.includes('FECHA')) {
                    thFilter.innerHTML = `<input type="date" class="filter-input col-filter" data-colindex="${idx + 1}" oninput="filtrarTablaCompleta()">`;
                } else {
                    thFilter.innerHTML = `<input type="text" class="filter-input col-filter" list="datalist_${idx + 1}" data-colindex="${idx + 1}" placeholder="Filtrar..." oninput="filtrarTablaCompleta()"><datalist id="datalist_${idx + 1}"></datalist>`;
                }
                trFilter.appendChild(thFilter);
            });

            const thAcciones = document.createElement('th'); thAcciones.className = 'th-title'; thAcciones.textContent = 'ACC.'; 
            trHeader.appendChild(thAcciones); trFilter.appendChild(document.createElement('th'));
        }

        // --- LECTURA Y CREACIÓN DE FILAS ---
        async function cargarDatos() {
            const { data, error } = await client.from('dpto_tecnico').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            
            const tbody = document.getElementById('tableBody'); tbody.innerHTML = ''; 
            data.forEach(filaBD => {
                let d = filaBD.datos || [];
                while(d.length < 32) d.push(""); // Aseguramos que el array tenga las 32 columnas
                tbody.appendChild(crearFilaHTML(filaBD.precinto, d));
            });
            window.filtrarTablaCompleta(); window.actualizarDatalists();
        }

        function crearFilaHTML(precinto = null, datos = []) {
            const tr = document.createElement('tr');
            if (precinto) tr.dataset.id = precinto;
            
            const tdCheck = document.createElement('td'); tdCheck.className = 'col-checkbox';
            tdCheck.innerHTML = `<input type="checkbox" class="row-checkbox" style="cursor:pointer;" onchange="actualizarSeleccion()">`;
            tr.appendChild(tdCheck);

            allCols.forEach((colName, index) => {
                const td = document.createElement('td'); 
                const valorRaw = datos[index] || '';

                if(colName === 'FOTO') { 
                    td.contentEditable = "false"; td.style.textAlign = "center"; 
                    if(valorRaw && valorRaw.includes('http')) {
                        td.innerHTML = `<img src="${valorRaw}" style="height: 40px; width: 40px; border-radius: 4px; object-fit: contain; cursor: zoom-in; background: white; border: 1px solid #d1d5db;" onclick="abrirModalImagen(this.src, event)">`;
                    } else { td.innerHTML = `<span style="color:#9ca3af">-</span>`; }
                } else if (colName === 'PRECINTO') { 
                    td.contentEditable = "false"; td.innerHTML = `<strong style="color:#2563eb">${valorRaw}</strong>`; 
                } else if (colName === 'RESULTADO') { 
                    td.contentEditable = "false";
                    td.innerHTML = `<select style="width:100%; border:none; background:transparent; font-size:13px; color:#111827; cursor:pointer; outline: none;">
                        <option value=""></option>
                        <option value="APROBADO" ${valorRaw === 'APROBADO' ? 'selected' : ''}>APROBADO</option>
                        <option value="RECHAZADO" ${valorRaw === 'RECHAZADO' ? 'selected' : ''}>RECHAZADO</option>
                        <option value="CON OBSERVACIONES" ${valorRaw === 'CON OBSERVACIONES' ? 'selected' : ''}>CON OBSERVACIONES</option>
                    </select>`;
                } else if (colName.includes('FECHA')) { 
                    td.contentEditable = "false"; 
                    td.innerHTML = `<input type="date" value="${valorRaw}" style="width:100%; border:none; background:transparent; font-size:13px; color:#111827; outline: none; cursor: pointer;">`;
                } else { 
                    td.contentEditable = "true"; td.textContent = valorRaw; 
                }
                tr.appendChild(td);
            });

            const tdAcciones = document.createElement('td');
            tdAcciones.innerHTML = `<button onclick="eliminarFila(this)" title="Eliminar Muestra" style="background:#f3f4f6; color:#374151; border:1px solid #d1d5db; padding:5px 8px; border-radius:4px; cursor:pointer; font-size: 12px; transition: 0.2s;" onmouseover="this.style.background='#fee2e2'; this.style.color='#ef4444';" onmouseout="this.style.background='#f3f4f6'; this.style.color='#374151';">🗑️</button>`;
            tr.appendChild(tdAcciones); return tr;
        }

        window.extraerDatosFila = function(tr) {
            const celdas = tr.querySelectorAll('td'); let datosFila = [];
            for(let i = 1; i < celdas.length - 1; i++) { 
                let colName = allCols[i - 1];
                if (colName === 'FOTO') { 
                    const img = celdas[i].querySelector('img'); datosFila.push(img ? img.src : "");
                } else if (colName === 'RESULTADO') { 
                    const select = celdas[i].querySelector('select'); datosFila.push(select ? select.value : "");
                } else if (colName.includes('FECHA')) { 
                    const dateInp = celdas[i].querySelector('input[type="date"]'); datosFila.push(dateInp ? dateInp.value : celdas[i].innerText.trim());
                } else { 
                    datosFila.push(celdas[i].innerText.trim());
                }
            } 
            return datosFila;
        };

        // --- GUARDAR MASIVO ---
        window.guardarCambiosVisibles = async function() {
            const btn = document.getElementById('btnGuardarGlobal'); const textoOriginal = btn.innerHTML;
            btn.innerHTML = "⏳ Guardando..."; btn.disabled = true;

            const filas = document.getElementById('tableBody').querySelectorAll('tr');
            let promesasUpdate = [];

            for (let tr of filas) {
                if (tr.style.display === 'none') continue; 
                let datosFila = window.extraerDatosFila(tr);
                if (tr.dataset.id) { promesasUpdate.push( client.from('dpto_tecnico').update({ datos: datosFila }).eq('precinto', tr.dataset.id) ); } 
            }

            try {
                if (promesasUpdate.length > 0) { 
                    const resultados = await Promise.all(promesasUpdate); 
                    for (let res of resultados) { if (res.error) throw res.error; } 
                }
                btn.innerHTML = "✅ ¡Todo guardado!"; actualizarDatalists(); 
            } catch (err) {
                console.error(err); alert("Hubo un error al guardar: " + err.message); btn.innerHTML = "❌ Error";
            }
            setTimeout(() => { btn.innerHTML = textoOriginal; btn.disabled = false; }, 3000);
        };

        // --- FILTROS Y BÚSQUEDA ---
        window.filtrarTablaCompleta = function() {
            const textoGlobal = document.getElementById('inputBusquedaGlobal').value.toLowerCase();
            const inputsColumnas = document.querySelectorAll('.col-filter');
            const filas = document.getElementById('tableBody').querySelectorAll('tr');

            filas.forEach(fila => {
                const celdas = fila.querySelectorAll('td');
                let coincideGlobal = true; if (textoGlobal !== "") coincideGlobal = fila.innerText.toLowerCase().includes(textoGlobal);

                let coincidenColumnas = true;
                inputsColumnas.forEach(input => {
                    const textoFiltroRaw = input.value.trim(); const textoFiltroLower = textoFiltroRaw.toLowerCase();
                    if (textoFiltroRaw !== "") {
                        const colIndex = input.getAttribute('data-colindex'); const celda = celdas[colIndex]; let celdaTexto = "";
                        if (celda.querySelector('select')) { celdaTexto = celda.querySelector('select').value; } 
                        else if (celda.querySelector('input[type="date"]')) { celdaTexto = celda.querySelector('input[type="date"]').value; } 
                        else { celdaTexto = celda.innerText.trim(); }
                        
                        const celdaTextoLower = celdaTexto.toLowerCase();
                        const datalist = document.getElementById(`datalist_${colIndex}`); let isExactOption = false;
                        if (datalist) { const options = Array.from(datalist.options).map(o => o.value.toLowerCase()); if (options.includes(textoFiltroLower)) isExactOption = true; }

                        if (textoFiltroRaw.startsWith('"') && textoFiltroRaw.endsWith('"')) {
                            let exactTerm = textoFiltroLower.slice(1, -1).trim(); if (exactTerm !== celdaTextoLower) coincidenColumnas = false; 
                        } else if (isExactOption) {
                            if (celdaTextoLower !== textoFiltroLower) coincidenColumnas = false;
                        } else {
                            if (!celdaTextoLower.includes(textoFiltroLower)) coincidenColumnas = false;
                        }
                    }
                });
                if (coincideGlobal && coincidenColumnas) { fila.style.display = ''; } 
                else { fila.style.display = 'none'; const cb = fila.querySelector('.row-checkbox'); if(cb) cb.checked = false; }
            });
            window.actualizarSeleccion(); 
        };

        window.actualizarDatalists = function() {
            const filas = Array.from(document.getElementById('tableBody').querySelectorAll('tr'));
            const inputsColumnas = document.querySelectorAll('.col-filter[type="text"]');
            inputsColumnas.forEach(input => {
                const colIndex = input.getAttribute('data-colindex'); const datalist = document.getElementById(`datalist_${colIndex}`);
                if (!datalist) return;
                const uniqueValues = new Set();
                filas.forEach(fila => {
                    if(!fila.dataset.id) return; 
                    const celdas = fila.querySelectorAll('td');
                    if (celdas[colIndex]) {
                        let val = ""; const celda = celdas[colIndex];
                        if (celda.querySelector('select')) { val = celda.querySelector('select').value; } 
                        else if (celda.querySelector('input[type="date"]')) { val = celda.querySelector('input[type="date"]').value; } 
                        else { val = celda.innerText.trim(); }
                        if (val !== "") uniqueValues.add(val);
                    }
                });
                datalist.innerHTML = '';
                Array.from(uniqueValues).sort().forEach(val => { const option = document.createElement('option'); option.value = val; datalist.appendChild(option); });
            });
        };

        // --- IMPORTACIÓN DESDE DISEÑO ---
        window.abrirBuscadorDiseno = function() { document.getElementById('inputBuscarPrecinto').value = ""; document.getElementById('resultadoBusqueda').style.display = "none"; document.getElementById('modal-agregar').style.display = "flex"; }
        window.cerrarModal = function(id) { document.getElementById(id).style.display = 'none'; }
        window.abrirModalImagen = function(src, event) { if(event) event.stopPropagation(); document.getElementById('imgModalSrc').src = src; document.getElementById('modalVisor').style.display = 'flex'; };

        window.buscarPrecintoEnDiseno = async function(e) {
            const btn = e.target; btn.textContent = "⏳";
            const precinto = document.getElementById('inputBuscarPrecinto').value.trim();
            const resDiv = document.getElementById('resultadoBusqueda');
            if(!precinto) { btn.textContent = "🔍 Buscar"; return alert("Escribe un precinto."); }

            const { data: yaExiste } = await client.from('dpto_tecnico').select('precinto').eq('precinto', precinto).single();
            if (yaExiste) { resDiv.style.display = 'block'; resDiv.innerHTML = `<div style="color:#b45309; text-align:center; font-weight:bold;">⚠️ Este precinto ya está en tu tabla.</div>`; btn.textContent = "🔍 Buscar"; return; }

            let { data: prenda } = await client.from('prendas').select('*').eq('precinto', precinto).single();
            if(!prenda) { const retry = await client.from('prendas').select('*').eq('id', precinto).single(); prenda = retry.data; }

            if(!prenda) {
                resDiv.style.display = 'block'; resDiv.innerHTML = `<div style="color:#ef4444; text-align:center; font-weight:bold;">❌ Precinto no encontrado en Diseño.</div>`;
            } else {
                const foto = prenda.fotoUrl || 'logo.png'; const jsonPrenda = encodeURIComponent(JSON.stringify(prenda));
                resDiv.style.display = 'block';
                resDiv.innerHTML = `
                    <div style="display:flex; gap:15px; align-items:center;">
                        <img src="${foto}" style="width:70px; height:70px; object-fit:cover; border-radius:6px; border:1px solid #d1d5db;">
                        <div style="flex-grow:1; font-size:13px; color:#374151;">
                            <div style="color:#2563eb; font-weight:bold; font-size:16px;">✅ ${prenda.precinto || prenda.id}</div>
                            <div style="margin-top:4px;"><b>Ref:</b> ${prenda.referencia || '-'} | <b>Colección:</b> ${prenda.coleccion || '-'}</div>
                            <div><b>Género:</b> ${prenda.genero || '-'} | <b>Proveedor:</b> ${prenda.proveedor || '-'}</div>
                        </div>
                    </div>
                    <button class="btn" style="width:100%; margin-top:15px; background-color: #10b981; color: white; border: none; font-weight: bold;" onclick="agregarAPatronaje('${jsonPrenda}', event)">➕ Agregar Fila a mi Tabla</button>
                `;
            }
            btn.textContent = "🔍 Buscar";
        }

        window.agregarAPatronaje = async function(jsonEncoded, e) {
            const btn = e.target; btn.textContent = "⏳ Agregando..."; btn.disabled = true;
            const prenda = JSON.parse(decodeURIComponent(jsonEncoded)); const precintoReal = prenda.precinto || prenda.id;
            
            let datosNuevos = new Array(32).fill('');
            datosNuevos[0] = prenda.fotoUrl || '';
            datosNuevos[2] = prenda.proveedor || '';
            datosNuevos[4] = prenda.coleccion || '';
            datosNuevos[5] = prenda.genero || '';
            datosNuevos[6] = precintoReal;
            datosNuevos[7] = prenda.referencia || '';

            const { error } = await client.from('dpto_tecnico').insert([{ precinto: precintoReal, datos: datosNuevos }]);
            
            if(error) { alert("Error al vincular: " + error.message); } 
            else { alert("✅ ¡Muestra agregada a tu tabla exitosamente!"); cerrarModal('modal-agregar'); cargarDatos(); }
            btn.textContent = "➕ Agregar Fila a mi Tabla"; btn.disabled = false;
        }

        // --- EXTRAS (SELECCIÓN Y EXPORTACIÓN) ---
        window.toggleSelectAll = function() {
            const isChecked = document.getElementById('selectAll').checked; const filas = document.getElementById('tableBody').querySelectorAll('tr');
            filas.forEach(tr => { if(tr.style.display !== 'none') { const cb = tr.querySelector('.row-checkbox'); if(cb) cb.checked = isChecked; } });
            window.actualizarSeleccion();
        };

        window.actualizarSeleccion = function() {
            const checkboxes = document.querySelectorAll('.row-checkbox:checked'); const bulkDiv = document.getElementById('bulkActions'); const countSpan = document.getElementById('selectedCount');
            let visiblesChecked = 0; checkboxes.forEach(cb => { if(cb.closest('tr').style.display !== 'none') visiblesChecked++; });
            if (visiblesChecked > 0) { bulkDiv.style.display = 'flex'; countSpan.textContent = visiblesChecked + " selec."; document.getElementById('btnEliminarMasivo').style.display = 'inline-block'; } 
            else { bulkDiv.style.display = 'none'; document.getElementById('btnEliminarMasivo').style.display = 'none'; }
        };

        window.eliminarFila = async function(btn) {
            if(!confirm("¿Seguro que deseas eliminar esta muestra de Patronaje?")) return;
            const tr = btn.closest('tr'); const idDb = tr.dataset.id;
            if(idDb) { const { error } = await client.from('dpto_tecnico').delete().eq('precinto', idDb); if(error) { alert("Error al eliminar"); return; } }
            tr.remove(); window.actualizarDatalists();
        };

        window.eliminarSeleccionadas = async function() {
            const checkboxes = document.querySelectorAll('.row-checkbox:checked'); let idsToDelete = []; let rowsToRemove = [];
            checkboxes.forEach(cb => { const tr = cb.closest('tr'); if(tr.style.display !== 'none' && tr.dataset.id) { idsToDelete.push(tr.dataset.id); rowsToRemove.push(tr); } });
            if (rowsToRemove.length === 0) return;
            if (!confirm(`¿Estás seguro de eliminar definitivamente ${rowsToRemove.length} muestras de Patronaje?`)) return;
            if (idsToDelete.length > 0) { const { error } = await client.from('dpto_tecnico').delete().in('precinto', idsToDelete); if(error) { alert("Error al eliminar masivamente"); return; } }
            rowsToRemove.forEach(tr => tr.remove()); document.getElementById('selectAll').checked = false; window.actualizarSeleccion(); window.actualizarDatalists();
        };

        let columnaOrdenadaActual = -1; let ordenAscendente = true;
        window.ordenarTabla = function(colIndex) {
            const tbody = document.getElementById('tableBody'); const filas = Array.from(tbody.querySelectorAll('tr'));
            if (columnaOrdenadaActual === colIndex) { ordenAscendente = !ordenAscendente; } else { ordenAscendente = true; columnaOrdenadaActual = colIndex; }
            filas.sort((a, b) => {
                let valorA = a.cells[colIndex].innerText.trim().toLowerCase(); let valorB = b.cells[colIndex].innerText.trim().toLowerCase();
                const inputA = a.cells[colIndex].querySelector('input[type="date"], select'); const inputB = b.cells[colIndex].querySelector('input[type="date"], select');
                if(inputA) valorA = inputA.value; if(inputB) valorB = inputB.value;
                let numA = parseFloat(valorA); let numB = parseFloat(valorB);
                if (!isNaN(numA) && !isNaN(numB) && !inputA) return ordenAscendente ? numA - numB : numB - numA;
                if (valorA < valorB) return ordenAscendente ? -1 : 1; if (valorA > valorB) return ordenAscendente ? 1 : -1; return 0;
            });
            filas.forEach(fila => tbody.appendChild(fila));
        };

        window.exportarAExcel = function() {
            let dataExcel = []; let encabezados = [...allCols]; dataExcel.push(encabezados);
            const filas = document.getElementById('tableBody').querySelectorAll('tr');
            filas.forEach(fila => {
                if(fila.style.display !== 'none') {
                    let filaData = window.extraerDatosFila(fila);
                    for(let i = 0; i < filaData.length; i++) { if(allCols[i] === 'FOTO' && (filaData[i].startsWith('data:image') || filaData[i].startsWith('http'))) filaData[i] = "🖼️ Imagen Cargada"; }
                    dataExcel.push(filaData);
                }
            });
            const hoja = XLSX.utils.aoa_to_sheet(dataExcel); const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Patronaje"); XLSX.writeFile(libro, "Seguimiento_Patronaje.xlsx");
        };

        inicializarEncabezados(); cargarDatos();
    </script>
</body>
</html>
